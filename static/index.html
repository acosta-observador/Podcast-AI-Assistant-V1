<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podcast Plus AI Assistant</title>
<style>
:root{
  --bg:#ffffff; --panel:#f5f5f7; --card:#ffffff; --line:#e3e3e8; --hover:#ececf0;
  --text:#1d1d1f; --muted:#6e6e73; --faint:#aeaeb2;
  --accent:#0071e3; --accent-soft:#e8f1fc; --warn:#c96a00; --warn-soft:#fff4e5; --ok:#248a3d;
  --r:14px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --panel:#1c1c1e; --card:#1c1c1e; --line:#2c2c2e; --hover:#2a2a2d;
    --text:#f5f5f7; --muted:#a1a1a6; --faint:#636366;
    --accent:#2997ff; --accent-soft:#0b2a4a; --warn:#ffb340; --warn-soft:#2e2208; --ok:#30d158;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --panel:#1c1c1e; --card:#1c1c1e; --line:#2c2c2e; --hover:#2a2a2d;
  --text:#f5f5f7; --muted:#a1a1a6; --faint:#636366;
  --accent:#2997ff; --accent-soft:#0b2a4a; --warn:#ffb340; --warn-soft:#2e2208; --ok:#30d158;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;border-radius:8px}
a{color:var(--accent);text-decoration:none}

/* estrutura com barra lateral */
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 260px;width:260px;max-width:100%;padding:20px 16px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.main{flex:1 1 640px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;padding:0 12px 14px;color:var(--text)}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo i svg{width:16px;height:16px}
.logo span{font-size:14px;line-height:1.2}.logo span em{display:block;font-style:normal;font-weight:400;color:var(--muted)}
.side .back{padding:6px 12px;font-size:14px}
.side .proj-n{padding:10px 12px 4px}.side .proj-n b{display:block;font-size:15px;font-weight:600;line-height:1.3}.side .proj-n span{font-size:13px;color:var(--muted)}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:18px 12px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);font-size:15px}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.page-t{margin:0 0 6px;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.page-s{margin:0;font-size:18px;color:var(--muted);max-width:56ch}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;margin-top:32px}
.pcard{display:flex;flex-direction:column;overflow:hidden;color:var(--text)}
.pcard:hover{border-color:var(--faint);background:var(--hover)}
.pcard .cov{height:140px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.pcard .cov svg{width:56px;height:56px}
.pcard .bd{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.pcard .bd b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.pcard .bd small{color:var(--muted);font-size:14px}
.pcard .pill{align-self:flex-start}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:6px;padding:18px 20px;color:var(--text)}
.fcard:hover{background:var(--hover);border-color:var(--faint)}
.fcard .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.fcard .ico svg{width:20px;height:20px}
.fcard b{font-size:16px;font-weight:600}.fcard span{font-size:14px;color:var(--muted)}
.audio{padding:22px 24px;margin-bottom:32px}
.audio .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.audio .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.audio .wv{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.wave{display:flex;align-items:center;gap:2px;height:56px}
.wave i{flex:1;border-radius:2px;background:var(--line);transition:background .1s}
.wave i.on{background:var(--accent)}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:980px;background:var(--panel);font-size:13px;font-weight:500}
.chip:hover:not(:disabled){background:var(--hover)}.chip:disabled{opacity:.45}

/* estrutura plus */
.tl{overflow:hidden}
.tl-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-bar .play{width:36px;height:36px}.tl-bar .play svg{width:16px;height:16px}
.tl-time{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tl-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.tl-inner{min-width:100%}
.tl-row{display:flex;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-lbl{position:sticky;left:0;z-index:3;background:var(--card);width:170px;flex:none;box-sizing:border-box;padding:0 8px 0 14px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;font-size:14px;font-weight:600}
.tl-lbl .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.trk-dl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.trk-dl:hover:not(:disabled){background:var(--hover);color:var(--accent)}.trk-dl:disabled{opacity:.3;cursor:default}
.trk-dl svg{width:15px;height:15px}
.tl-lbl small{font-size:12px;color:var(--muted);font-weight:400}
.tl-lane{position:relative;flex:1;min-width:0;border-left:1px solid var(--line);overflow:hidden}
.tl-ruler{height:30px;background:var(--panel);cursor:pointer}
.tl-lbl.rl{background:var(--panel)}
.tl-ruler span{position:absolute;top:7px;padding-left:6px;font-size:11px;color:var(--muted);border-left:1px solid var(--faint);height:16px;line-height:14px;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tl-wrap{position:relative}
.tl-ov{position:absolute;top:0;bottom:0;left:170px;right:0;pointer-events:none}
.tl-ph{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);margin-left:-1px}
.clip{position:absolute;top:6px;bottom:6px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;text-align:left;cursor:pointer;min-width:6px}
.clip .nm{overflow:hidden;text-overflow:ellipsis}
.clip .bars{display:flex;align-items:center;gap:1px;height:50%}
.clip .bars i{flex:1;border-radius:1px;min-width:1px;background:currentColor;opacity:.7}
.clip.nar{background:var(--accent-soft);color:var(--accent)}
.clip.sfx{background:rgba(255,159,10,.16);color:#c77700}
.clip.mus{background:rgba(125,92,255,.14);color:#6b4cf0}
.clip.amb{background:rgba(48,176,199,.16);color:#1d8a9c}
.clip.sel{box-shadow:0 0 0 2px var(--accent)}
.clip.gen{opacity:.55}.clip.err{background:var(--warn-soft);color:#d70015}
.sel-card{margin-top:20px;padding:20px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sel-card textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:15px;color:var(--text);resize:vertical}
.scn-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.sc-chip{height:34px;padding:0 14px;border-radius:980px;background:var(--panel);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.sc-chip:hover{background:var(--hover)}
.sc-chip.on{background:var(--accent);color:#fff}
.sc-chip svg{width:12px;height:12px;color:var(--ok)}.sc-chip.on svg{color:#fff}
.clip.scn{background:var(--panel);color:var(--text);justify-content:center;align-items:center;text-align:center;top:4px;bottom:4px}
.epsel{height:34px;border-radius:980px;border:1px solid var(--line);background:var(--card);padding:0 12px;font:inherit;font-size:14px;color:var(--text);max-width:100%}
.tl-pop{position:fixed;z-index:50;width:310px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.tl-pop input[type=text]{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-size:15px;color:var(--text);width:100%}
.tl-pop input[type=number]{height:30px;width:64px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font:inherit;color:var(--text)}
.tl-lane[data-lane]{cursor:crosshair}
.an-sc{padding:20px 22px;margin-bottom:16px}
.an-sc h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.an-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
.an-row{display:contents}
.an-row>div{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.an-head{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:8px 0}
.an-txt{font-size:15px;line-height:1.5}
.an-txt.titulo{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.an-txt.nota{font-size:13px;font-style:italic;color:var(--faint)}
.an-txt.entrevista{color:var(--muted);border-radius:8px;background:rgba(255,159,10,.08);padding:8px 10px}
.cue-e{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;margin-bottom:10px;padding:10px 12px;border-radius:12px;background:var(--panel)}
.cue-e textarea{grid-column:2;width:100%;border:0;background:transparent;font:inherit;font-size:14px;line-height:1.4;color:var(--text);resize:none;padding:0;min-height:20px}
.cue-e textarea:focus,.cue-e input:focus{outline:2px solid var(--accent-soft);border-radius:6px;background:var(--bg)}
.cue-e .pr{grid-column:2/4;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.cue-e .pr input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);padding:2px 4px}
.cue-e select{border:0;background:transparent;font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:980px;padding:3px 6px;cursor:pointer}
.cue-e select.sfx{background:rgba(255,159,10,.16);color:#c77700}.cue-e select.ambience{background:rgba(48,176,199,.16);color:#1d8a9c}.cue-e select.music{background:rgba(125,92,255,.14);color:#6b4cf0}
.mp{padding:18px 20px;margin-top:14px}
.mp .hd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mp textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;color:var(--text);resize:vertical;min-height:64px;box-sizing:border-box;margin-top:10px}
.mp textarea:focus,.mp input[type=number]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.mp .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.mp input[type=number]{height:30px;width:70px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font:inherit;color:var(--text)}
.mp audio{width:100%;max-width:520px;height:36px}
.rchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;letter-spacing:.03em;background:rgba(125,92,255,.14);color:#6b4cf0}
.rchip.stem{background:rgba(48,176,199,.16);color:#1d8a9c}.rchip.stinger{background:rgba(255,159,10,.16);color:#c77700}.rchip.transition{background:var(--panel);color:var(--muted)}
.snd-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.snd{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 6px 5px 12px;border-radius:980px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.3}
.snd.music{background:rgba(125,92,255,.12);border-color:rgba(125,92,255,.3);color:#6b4cf0}
.snd .st{outline:none;min-width:14px;overflow-wrap:anywhere}
.snd .st:focus{background:var(--bg);border-radius:6px;padding:0 4px}
.snd .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.snd .x:hover{background:var(--warn-soft);color:#d70015}
.snd .x svg{width:12px;height:12px}
.snd-add{height:32px;min-width:150px;flex:1 1 150px;border:1px dashed var(--line);border-radius:980px;background:transparent;padding:0 12px;font:inherit;font-size:14px;color:var(--text)}
.snd-add:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--bg)}
.an-lines{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;color:var(--text);resize:vertical;min-height:46px;box-sizing:border-box}
.an-lines:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.an-lines.saving{opacity:.6}
.cue-add{font-size:13px;color:var(--accent);padding:4px 0}
.cue-form{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);margin-top:4px}
.cue-form input[type=text]{height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 10px;font:inherit;font-size:14px;color:var(--text)}
@media (max-width:900px){.an-grid{grid-template-columns:1fr}.an-row>div:first-child{border-bottom:0;padding-bottom:0}.an-row>div:last-child{border-top:0;padding-top:4px}}
.an-cue{display:grid;grid-template-columns:auto 1fr auto;gap:10px 14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.an-cue .del{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)}
.an-cue .del:hover{background:var(--warn-soft);color:#d70015}
.an-cue .del svg{width:16px;height:16px}
.kchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;white-space:nowrap;letter-spacing:.02em}
.kchip.sfx{background:rgba(255,159,10,.16);color:#c77700}.kchip.amb{background:rgba(48,176,199,.16);color:#1d8a9c}.kchip.mus{background:rgba(125,92,255,.14);color:#6b4cf0}
.itag{font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--panel);color:var(--muted);white-space:nowrap}
.itag.narracao{background:var(--accent-soft);color:var(--accent)}.itag.entrevista{background:rgba(255,159,10,.16);color:#c77700}
.st-note{font-size:13px;color:var(--muted)}

/* barra de topo */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:52px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{font-weight:600;font-size:15px;color:var(--text);white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
.back{display:inline-flex;align-items:center;gap:4px;font-size:15px;color:var(--accent)}
.back svg{width:18px;height:18px}
.top-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top-actions{display:flex;justify-content:flex-end;gap:8px}

.btn{height:32px;padding:0 14px;border-radius:980px;font-size:14px;font-weight:500;background:var(--panel);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.45}
.btn.blue{background:var(--accent);color:#fff}
.btn.blue:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn svg{width:16px;height:16px}
.link{color:var(--accent);font-size:14px}
.link:disabled{color:var(--faint)}

.wrap{max-width:1180px;margin:0 auto;padding:36px 20px 80px}
.intro h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.025em;margin:0 0 6px}
.intro p{font-size:17px;color:var(--muted);margin:0 0 32px;max-width:56ch}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.section-t{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px 4px}

/* lista de episódios */
.eps{overflow:hidden}
.ep-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.ep-row:first-child{border-top:0}
.ep-row:hover{background:var(--panel)}
.ep{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 18px;color:var(--text)}
.ep-del{flex:none;width:36px;height:36px;margin-right:12px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--faint);cursor:pointer}
.ep-del:hover,.ep-del:focus-visible{background:var(--warn-soft);color:#d70015}
.ep-del svg{width:18px;height:18px}
.ep b{font-weight:600;font-size:16px}
.ep small{color:var(--muted);font-size:13px}
.ep .pill{grid-row:1/3;grid-column:2;align-self:center}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* formulário */
form.new{padding:20px;display:flex;flex-direction:column;gap:14px}
form.new h2{margin:0;font-size:19px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input[type=text]{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;color:var(--text)}
.field input[type=text]:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.drop:hover{border-color:var(--faint)}
.drop.has{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:26px;height:26px;color:var(--accent);flex:none}
.drop b{display:block;font-weight:600;font-size:15px;color:var(--text)}
.drop small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}
.drop:focus-within{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.primary{height:44px;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}
.primary:disabled{background:var(--panel);color:var(--faint)}
.bar{height:4px;background:var(--panel);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.note{font-size:13px;color:var(--muted);margin:0}

/* processamento */
.proc{max-width:520px;margin:40px auto;padding:28px}
.proc h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.proc > p{color:var(--muted);margin:0 0 22px}
.stage{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--faint);font-size:16px}
.stage .ic{width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;flex:none}
.stage.done{color:var(--text)} .stage.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.stage.done .ic svg{width:13px;height:13px}
.stage.now{color:var(--text);font-weight:600} .stage.now .ic{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}

/* episódio */
.ep-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ep-head h1{font-size:28px;margin:0;letter-spacing:-.025em;line-height:1.15}
.ep-head p{margin:4px 0 0;color:var(--muted)}
.layout{display:grid;grid-template-columns:360px minmax(0,1fr);gap:24px;align-items:start}
.blocks{overflow:hidden;max-height:calc(100vh - 190px);overflow-y:auto;position:sticky;top:72px}
.blk{display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:start;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk:hover{background:var(--panel)}
.blk.cur{background:var(--accent-soft)}
.blk .n{font-size:13px;font-weight:600;color:var(--muted);padding-top:1px;text-align:right}
.blk .t{font-size:14px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.blk .ch{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.tick{width:14px;height:14px;color:var(--ok)}

.detail{padding:28px 30px}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.d-top h2{margin:0;font-size:13px;font-weight:600;color:var(--muted)}
.nav{display:flex;gap:6px}
.nav button{width:32px;height:32px;border-radius:50%;background:var(--panel);display:grid;place-items:center}
.nav button:hover:not(:disabled){background:var(--hover)}
.nav button:disabled{opacity:.35}
.nav svg{width:16px;height:16px}
.script{font-size:21px;line-height:1.5;letter-spacing:-.015em;margin:0 0 26px;max-width:62ch}

.segctl{display:inline-flex;flex-wrap:wrap;background:var(--panel);border-radius:10px;padding:3px;gap:2px}
.segctl button{min-width:74px;padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--text);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.segctl button small{font-size:11px;color:var(--muted);font-weight:400}
.segctl button:hover:not([aria-pressed="true"]){background:var(--hover)}
.segctl button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.lbl{font-size:13px;color:var(--muted);margin:0 0 8px}

.player{display:flex;align-items:center;gap:16px;margin:24px 0 8px}
.play{width:52px;height:52px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.play:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
.play:disabled{background:var(--panel);color:var(--faint)}
.play svg{width:22px;height:22px}
.p-meta b{display:block;font-size:16px;font-weight:600}
.p-meta span{color:var(--muted);font-size:14px}
.prog{flex:1;height:4px;border-radius:2px;background:var(--panel);overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}

.flags{margin:20px 0 0;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:flex;flex-direction:column;gap:4px}
.said{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.said p{margin:0 0 14px;color:var(--muted);font-size:15px;max-width:66ch}
.said p b{color:var(--text);font-weight:600;font-size:13px;display:block;margin-bottom:2px}
.d-actions{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap;align-items:center}
.kb{margin-top:18px;font-size:12px;color:var(--faint)}
kbd{font-family:var(--font);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;color:var(--muted)}
.banner{max-width:1180px;margin:12px auto 0;padding:10px 14px;border-radius:12px;background:var(--panel);color:var(--muted);font-size:13px}

@media (max-width: 900px){
  .grid2,.layout{grid-template-columns:1fr}
  .blocks{position:static;max-height:none}
  .detail{padding:22px 18px}
  .script{font-size:18px}
  .top-title{display:none}
  .top-in{grid-template-columns:auto 1fr}
  .side{flex-basis:100%;width:100%;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .page-t{font-size:32px}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<audio id="player" preload="none"></audio>

<script>
/* ---------- ícones ---------- */
const I = {
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10.2-6.8c.6-.4.6-1.2 0-1.6L9.6 4.4C8.9 3.9 8 4.4 8 5.2z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h1M7.5 9v6M11 5v14M14.5 8v8M18 10.5v3M20.5 12h-.5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 10v4M9 6v12M13 9v6M17 4v16M21 11v2"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
};

/* ---------- estado ---------- */
const S = { demo:false, list:[], ep:null, cur:0, playing:false, poll:null };
const $app = document.getElementById('app');
const player = document.getElementById('player');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(x).padStart(2,'0'); };
const capital = s => s ? s[0].toUpperCase() + s.slice(1) : s;

async function api(path, opts = {}) {
  if (S.demo) return Demo.api(path, opts);
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m); }
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
}

/* ---------- navegação ---------- */
window.addEventListener('hashchange', route);
async function route() {
  stopAudio(); clearTimeout(S.poll); stopStructure(); clearTimeout(ST.poll); clearTimeout(AN.poll); clearTimeout(MA.poll); player.onloadedmetadata = player.ontimeupdate = player.onpause = player.onplay = null; if (!player.paused) player.pause();
  const m = location.hash.match(/^#\/ep\/([\w-]+)/);
  if (m) return openEpisode(m[1]);
  if (location.hash === '#/projeto') return projectPage();
  if (location.hash === '#/autotake') return home();
  const mm = location.hash.match(/^#\/maestro(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (mm) return maestroPage(mm[1], mm[2] ? +mm[2] : null);
  const ma = location.hash.match(/^#\/analise(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (ma) return analisePage(ma[1], ma[2] ? +ma[2] : null);
  const me = location.hash.match(/^#\/estrutura(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (me) return estruturaPage(me[1], me[2] ? +me[2] : null);
  return projectsPage();
}

function topbar({ left, title = '', actions = '' }) {
  return `<div class="top"><div class="top-in">
    <div>${left}</div><div class="top-title">${esc(title)}</div><div class="top-actions">${actions}</div>
  </div></div>${S.demo ? '<div class="banner">Demonstração: os dados são fictícios e não há áudio. No servidor, o upload e a transcrição funcionam a partir desta página.</div>' : ''}`;
}
const brand = `<b class="brand">AutoTake</b>`;
const backLink = `<a class="back" href="#/autotake">${I.chevL}Episódios</a>`;

const PROJECT = { name: 'As Sombras de Duarte Lima', ep: 'EP 4' };
function side(active) {
  const it = (key, href, icon, label) => `<a class="nav-i ${active === key ? 'on' : ''}" href="${href}">${icon}<span>${label}</span></a>`;
  return `<aside class="side">
    <a class="logo" href="#/"><i>${I.logo}</i><span>Podcast Plus<em>AI Assistant</em></span></a>
    <a class="back" href="#/">${I.chevL}Projetos</a>
    <div class="proj-n"><b>${esc(PROJECT.name)}</b><span>${PROJECT.ep}</span></div>
    <p class="sec">Episódio</p>${it('geral', '#/projeto', I.grid, 'Visão geral')}
    <p class="sec">Funcionalidades</p>${it('autotake', '#/autotake', I.wave, 'AutoTake')}${it('analise', '#/analise', I.doc, 'Análise de Guião')}${it('maestro', '#/maestro', I.music, 'Maestro')}${it('estrutura', '#/estrutura', I.layers, 'Estrutura Plus')}
  </aside>`;
}
const shell = (active, html) => `<div class="shell">${active ? side(active) : ''}<div class="main">${html}</div></div>`;
const plainTop = `<div class="top"><div class="top-in"><div>${brand}</div><div></div><div></div></div></div>`;

/* ---------- homepage: projetos ---------- */
function projectsPage() {
  $app.innerHTML = `<div class="top"><div class="top-in"><a class="logo" href="#/" style="padding:0"><i>${I.logo}</i><span style="font-size:15px">Podcast Plus <em style="display:inline;margin-left:4px">AI Assistant</em></span></a><div></div><div class="top-actions"><span style="font-size:13px;color:var(--muted)">Observador</span></div></div></div>
  <div class="wrap">
    <h1 class="page-t">Projetos</h1>
    <p class="page-s">Um projeto por podcast. Abre um para trabalhar o áudio do episódio com as ferramentas do assistente.</p>
    <div class="projs">
      <a class="card pcard" href="#/projeto"><div class="cov">${I.wave}</div>
        <div class="bd"><span class="pill run"><i></i>Próximo podcast</span><div><b>${esc(PROJECT.name)}</b><small>Podcast Plus · ${PROJECT.ep}</small></div></div></a>
    </div>
  </div>`;
}

/* ---------- visão geral do projeto ---------- */
async function projectPage() {
  try { S.list = await api('/api/episodes'); } catch { S.list = []; }
  const ready = S.list.find(e => e.state?.status === 'pronto');
  const bars = Array.from({ length: 96 }, (_, i) => `<i style="height:${Math.min(52, 6 + Math.round(Math.abs(Math.sin(i * .31) * Math.cos(i * .09 + 1)) * 44 + (i % 5) * 1.5))}px"></i>`).join('');
  const audio = ready ? `<div class="card audio">
      <div class="hd"><b>Áudio do episódio</b><span class="note">${esc(ready.title)}</span></div>
      <div class="row"><button class="play" id="pPlay" aria-label="Ouvir" ${S.demo ? 'disabled' : ''}>${I.play}</button>
        <div class="wv"><div class="wave" id="pWave">${bars}</div><div class="tm"><span id="pCur">0:00</span><span id="pDur">—</span></div></div></div>
      <div class="chips"><button class="chip" id="pBack" ${S.demo ? 'disabled' : ''}>−15 s</button><button class="chip" id="pFwd" ${S.demo ? 'disabled' : ''}>+15 s</button></div>
    </div>` : `<div class="card empty" style="margin-bottom:32px">Ainda não há áudio neste episódio.<br>Abre o AutoTake e carrega a gravação e o guião para começar.</div>`;
  $app.innerHTML = shell('geral', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios e não há áudio.</div>' : ''}
    <div class="wrap">
      <span class="pill run" style="display:inline-block;margin-bottom:12px"><i></i>Próximo podcast</span>
      <h1 class="page-t" style="margin-top:0">${esc(PROJECT.name)}</h1>
      <p class="page-s" style="margin-bottom:32px">Podcast Plus · ${PROJECT.ep}</p>
      ${audio}
      <p class="section-t">Funcionalidades</p>
      <div class="fgrid">
        <a class="card fcard" href="#/autotake"><span class="ico">${I.wave}</span><b>AutoTake</b><span>Encontra os takes de cada parágrafo e escolhe o melhor.</span></a>
        <a class="card fcard" href="#/analise"><span class="ico">${I.doc}</span><b>Análise de Guião</b><span>As cenas do guião e os sons de cada parágrafo.</span></a>
        <a class="card fcard" href="#/maestro"><span class="ico">${I.music}</span><b>Maestro</b><span>Músicas e stems para cada cena, criados a partir do texto.</span></a>
        <a class="card fcard" href="#/estrutura"><span class="ico">${I.layers}</span><b>Estrutura Plus</b><span>Em preparação.</span></a>
      </div>
    </div>`);
  if (!ready || S.demo) return;
  player.src = `/api/episodes/${ready.id}/audio`;
  const wave = document.getElementById('pWave'), cur = document.getElementById('pCur'), dur = document.getElementById('pDur'), btn = document.getElementById('pPlay');
  const paint = () => {
    const d = player.duration || 0, t = player.currentTime || 0, n = Math.round(wave.children.length * (d ? t / d : 0));
    [...wave.children].forEach((b, i) => b.classList.toggle('on', i < n));
    cur.textContent = fmt(t); if (d) dur.textContent = fmt(d);
    btn.innerHTML = player.paused ? I.play : I.stop;
  };
  player.onloadedmetadata = player.ontimeupdate = player.onpause = player.onplay = paint;
  btn.onclick = () => player.paused ? player.play() : player.pause();
  document.getElementById('pBack').onclick = () => { player.currentTime = Math.max(0, player.currentTime - 15); };
  document.getElementById('pFwd').onclick = () => { player.currentTime = Math.min(player.duration || 0, player.currentTime + 15); };
  wave.onclick = e => { if (player.duration) { const r = wave.getBoundingClientRect(); player.currentTime = (e.clientX - r.left) / r.width * player.duration; } };
}

/* ---------- Análise de Guião ---------- */
const AN = { id: null, data: null, poll: null };
const anRunning = a => a.status === 'a sugerir sons';
const nLines = t => (t || '').split('\n').filter(l => l.trim()).length;

async function analisePage(wanted, scene) {
  try { S.list = await api('/api/episodes'); } catch { S.list = []; }
  if (!S.list.length) {
    $app.innerHTML = shell('analise', `<div class="wrap"><h1 class="page-t">Análise de Guião</h1>
      <p class="page-s" style="margin-bottom:32px">As cenas do guião e os sons de cada parágrafo.</p>
      <div class="card empty">Ainda não há episódios. Carrega a gravação e o guião no <a href="#/autotake">AutoTake</a> primeiro.</div></div>`);
    return;
  }
  const pick = S.list.find(e => e.id === wanted) || S.list.find(e => e.id === AN.id) || S.list.find(e => e.state?.status === 'pronto') || S.list[0];
  AN.id = pick.id; AN.scene = scene || null;
  await loadAnalysis();
}

async function loadAnalysis() {
  clearTimeout(AN.poll);
  try { AN.data = await api(`/api/episodes/${AN.id}/analysis`); }
  catch (e) { $app.innerHTML = shell('analise', `<div class="wrap"><div class="errbox">${esc(e.message)}</div></div>`); return; }
  const running = anRunning(AN.data.analysis), a = document.activeElement;
  const typing = a && a.matches && a.matches('input.snd-add, [contenteditable], textarea');
  if (!typing || (AN.wasRunning && !running)) renderAnalysis();
  AN.wasRunning = running;
  if (running) AN.poll = setTimeout(loadAnalysis, 3000);
}

const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function lineParts(raw) {
  let t = raw.trim().replace(/^[-•*·]\s*/, ''), kind = 'sfx';
  const m = t.match(/^(m[úu]sica|music)\s*:\s*/i);
  if (m) { kind = 'music'; t = t.slice(m[0].length); }
  const i = t.indexOf('@');
  return { kind, text: (i >= 0 ? t.slice(0, i) : t).trim(), anchor: i >= 0 ? t.slice(i + 1).trim() : '' };
}
const buildLine = p => (p.kind === 'music' ? 'música: ' : '') + p.text + (p.anchor ? ' @ ' + p.anchor : '');
const linesOf = (an, id) => ((an.lines || {})[String(id)] || '').split('\n').filter(l => l.trim());
function cellHTML(an, id) {
  const chips = linesOf(an, id).map((raw, i) => { const p = lineParts(raw);
    return `<span class="snd ${p.kind}" data-i="${i}" ${p.anchor ? `title="Entra em: ${esc(p.anchor)}"` : ''}>${p.kind === 'music' ? '♪' : ''}<span class="st" contenteditable="${S.demo ? 'false' : 'plaintext-only'}" spellcheck="false">${esc(p.text)}</span><button class="x" type="button" aria-label="Remover ${esc(p.text)}" ${S.demo ? 'disabled' : ''}>${X_SVG}</button></span>`; }).join('');
  return chips + (S.demo ? '' : `<input class="snd-add" type="text" maxlength="300" placeholder="+ som (Enter)" aria-label="Acrescentar som">`);
}
async function saveLines(an, id, arr) {
  (an.lines = an.lines || {})[String(id)] = arr.join('\n');
  await api(`/api/episodes/${AN.id}/analysis/lines`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: id, text: arr.join('\n') }) }).catch(showErr);
}
function bindCell(an, w) {
  const id = +w.dataset.item, redraw = (focusAdd) => { w.innerHTML = cellHTML(an, id); bindCell(an, w); if (focusAdd) w.querySelector('.snd-add')?.focus(); };
  w.querySelectorAll('.snd').forEach(chip => {
    const i = +chip.dataset.i, st = chip.querySelector('.st');
    chip.querySelector('.x').onclick = async () => { const arr = linesOf(an, id); arr.splice(i, 1); await saveLines(an, id, arr); redraw(); };
    st.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); st.blur(); } };
    st.onblur = async () => {
      const arr = linesOf(an, id), p = lineParts(arr[i]), text = st.textContent.replace(/\s+/g, ' ').trim();
      if (text === p.text) return;
      if (!text) arr.splice(i, 1); else arr[i] = buildLine({ ...p, text });
      await saveLines(an, id, arr); redraw();
    };
  });
  const add = w.querySelector('.snd-add');
  if (add) add.onkeydown = async e => {
    if (e.key !== 'Enter' || !add.value.trim()) return;
    e.preventDefault();
    const arr = linesOf(an, id); arr.push(add.value.trim());
    await saveLines(an, id, arr); redraw(true);
  };
}

    document.getElementById('anall').onclick = async () => {
      const missing = scenes.filter(s => soundsIn(s) === 0).length, replace = missing === 0;

      try { await api(`/api/episodes/${AN.id}/analysis/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: 'all', replace }) }); } catch (e) { alert(e.message); return; }
      loadAnalysis();

async function maestroPage(wanted, scene) {

async function loadMaestro() {
  clearTimeout(MA.poll);
  try { MA.data = await api(`/api/episodes/${MA.id}/maestro`); }
  catch (e) { $app.innerHTML = shell('maestro', `<div class="wrap"><div class="errbox">${esc(e.message)}</div></div>`); return; }
  const running = maBusy(MA.data.maestro), a = document.activeElement;
  const typing = a && a.matches && a.matches('textarea, input[type=number], input[type=text]');
  if (!typing || (MA.wasRunning && !running)) renderMaestro();
  MA.wasRunning = running;
  if (running) MA.poll = setTimeout(loadMaestro, 3000);
}

async function estruturaPage(wanted, scene) {

    $app.innerHTML = shell('estrutura', `<div class="wrap"><h1 class="page-t">Estrutura Plus</h1>
      <p class="page-s" style="margin-bottom:32px">Cria a estrutura de sound design do episódio a partir do guião.</p>
      <div class="card empty">Ainda não há nenhum episódio processado.<br>Carrega a gravação e o guião no <a href="#/autotake">AutoTake</a> primeiro.</div></div>`);
    return;
  }
  const pick = ready.find(e => e.id === wanted) || ready.find(e => e.id === ST.id) || ready[0];
  if (ST.id !== pick.id) { ST.id = pick.id; ST.scene = null; ST.sel = null; ST.zoom = 1; }
  if (scene) { ST.scene = scene; ST.zoom = 1; }
  if (!S.demo) player.src = `/api/episodes/${ST.id}/audio`;
  await loadStructure();
}

function setView() {
  const d = ST.data, tl = d.timeline, sc = tl.scenes.find(x => x.n === ST.scene);
  const ends = d.structure.clips.filter(c => !sc || c.scene === sc.n).map(c => c.start + c.dur);
  if (sc) { ST.v0 = Math.max(0, sc.start - 1); ST.v1 = Math.max(sc.end, ...ends) + 1; }
  else { ST.v0 = 0; ST.v1 = Math.max(10, Math.ceil(Math.max(tl.total, ...ends) / 10) * 10); }
  ST.t = Math.min(ST.v1, Math.max(ST.v0, ST.t));
}

async function loadStructure() {
  clearTimeout(ST.poll);
  try { ST.data = await api(`/api/episodes/${ST.id}/structure`); }
  catch (e) { $app.innerHTML = shell('estrutura', `<div class="wrap"><div class="errbox">${esc(e.message)}</div></div>`); return; }
  const scenes = ST.data.timeline.scenes;
  if (ST.scene === null || (ST.scene !== 0 && !scenes.some(x => x.n === ST.scene))) ST.scene = scenes.length ? scenes[0].n : 0;
  setView();
  renderStructure();
  if (running(ST.data.structure)) ST.poll = setTimeout(() => loadStructure(), 2500);
}

function ticksHTML() {
  const sc = document.getElementById('tlscroll'), span = ST.v1 - ST.v0;
  const w = sc && sc.clientWidth > 300 ? sc.clientWidth : Math.max(600, window.innerWidth - 300);
  const lane = (w - 170) * ST.zoom, pps = lane / span;
  const step = [1, 2, 5, 10, 15, 30, 60, 120, 300].find(x => x * pps >= 70) || 300, out = [];
  for (let t = Math.ceil(ST.v0 / step) * step; t <= ST.v1; t += step) out.push(`<span style="left:${((t - ST.v0) / span * 100).toFixed(3)}%">${clock(t)}</span>`);
  return out.join('');
}

function applyZoom(z, clientX) {
  const sc = document.getElementById('tlscroll'), inn = document.getElementById('tlinner'); if (!sc || !inn) return;
  const rect = sc.getBoundingClientRect();
  const ax = Math.max(170, clientX != null ? clientX - rect.left : (rect.width + 170) / 2);
  const frac = (sc.scrollLeft + ax - 170) / Math.max(1, inn.clientWidth - 170);
  ST.zoom = Math.max(1, Math.min(24, z));
  inn.style.width = `calc(170px + (100% - 170px) * ${ST.zoom})`;
  sc.scrollLeft = frac * (inn.clientWidth - 170) + 170 - ax;
  document.getElementById('ruler').innerHTML = ticksHTML();
  const l = document.getElementById('zlbl'); if (l) l.textContent = Math.round(ST.zoom * 100) + '%';
}

function renderStructure() {
  const oldSc = document.getElementById('tlscroll'), keepLeft = oldSc ? oldSc.scrollLeft : 0;
  const d = ST.data, st = d.structure, tl = d.timeline, v0 = ST.v0, span = ST.v1 - ST.v0;
  const pct = x => ((x - v0) / span * 100).toFixed(3), inView = (a, b) => b > v0 && a < ST.v1;
  const scene = tl.scenes.find(x => x.n === ST.scene), sceneClips = n => st.clips.filter(c => c.scene === n);
  const bars = (arr, n) => (arr && arr.length ? arr : Array(n).fill(30)).map(h => `<i style="height:${h}%"></i>`).join('');
  const nar = tl.blocks.filter(b => inView(b.start, b.end)).map(b => `<button class="clip nar" style="left:${pct(b.start)}%;width:${(b.end - b.start) / span * 100}%" data-seek="${b.start}" title="${esc(b.text)}"><span class="nm">Bloco ${b.block}</span><span class="bars">${bars(b.peaks, 8)}</span></button>`).join('');
  const lane = k => st.clips.filter(c => c.lane === k && inView(c.start, c.start + c.dur)).map(c => `<button class="clip ${c.kind === 'music' ? 'mus' : c.kind === 'ambience' ? 'amb' : 'sfx'} ${c.state === 'a gerar' ? 'gen' : ''} ${c.state === 'erro' ? 'err' : ''} ${ST.sel === c.id ? 'sel' : ''}" style="left:${pct(c.start)}%;width:${c.dur / span * 100}%" data-clip="${c.id}"><span class="nm">${esc(c.label)}${c.state === 'a gerar' ? ', a gerar…' : c.state === 'erro' ? ', erro' : ''}</span><span class="bars">${bars(c.peaks, 8)}</span></button>`).join('');
  const laneHas = k => st.clips.some(c => c.lane === k && c.state === 'gerado' && (!scene || c.scene === scene.n));
  const row = (k, name, sub, h) => `<div class="tl-row" style="height:${h}px"><div class="tl-lbl"><span class="lt">${name}<small>${sub}</small></span>

  const chips = `<button class="sc-chip ${ST.scene === 0 ? 'on' : ''}" data-scene="0">Todas</button>` + tl.scenes.map(x => `<button class="sc-chip ${ST.scene === x.n ? 'on' : ''}" data-scene="${x.n}" title="${esc(x.subtitle || '')}">${esc(x.title)}${sceneClips(x.n).length ? I.check : ''}</button>`).join('');
  const epOpts = S.list.map(e => `<option value="${e.id}" ${e.id === ST.id ? 'selected' : ''} ${e.state?.status === 'pronto' ? '' : 'disabled'}>${esc(e.title)}${e.state?.status === 'pronto' ? '' : ' (a processar)'}</option>`).join('');
  const busy = running(st), n = st.clips.length, mySc = scene ? sceneClips(scene.n).length : 0;
  const status = d.missing.length ? `Falta a chave no servidor: ${d.missing.join(', ')}.`
    : st.batch > 0 && st.status === 'a gerar' ? `A criar todas as cenas (faltam ${st.batch}): cena ${st.scene}, ${st.done} de ${st.total}…`
    : st.batch > 0 ? `A criar todas as cenas (faltam ${st.batch}): a preparar a cena ${st.scene}…`
    : st.status === 'a planear' ? `A ler o guião da cena ${st.scene}…`
    : st.status === 'a gerar' ? `A gerar sons da cena ${st.scene}, ${st.done} de ${st.total}…`
    : scene ? (mySc ? `${sceneClips(scene.n).filter(c => c.state === 'gerado').length} de ${mySc} sons gerados nesta cena` : `${scene.title} ainda não tem sound design. Carrega em Create.`)
    : `${n} sons em ${tl.scenes.filter(x => sceneClips(x.n).length).length} de ${tl.scenes.length} cenas`;
  const info = scene ? `${scene.title}${scene.subtitle ? ' · ' + scene.subtitle : ''}, blocos ${scene.blocks[0]} a ${scene.blocks[scene.blocks.length - 1]}, ${clock(scene.start)} a ${clock(scene.end)}` : '';

  $app.innerHTML = shell('estrutura', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios e não há áudio nem geração.</div>' : ''}
    <div class="wrap">
      <div class="ep-head"><div><h1 class="page-t">Estrutura Plus</h1>
        <p class="page-s">Cria o sound design do episódio cena a cena: efeitos e música em faixas por baixo dos takes.</p></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
          <select class="epsel" id="epsel" aria-label="Episódio">${epOpts}</select>
          <button class="btn" id="exptr" ${S.demo || !n ? 'disabled' : ''} title="Uma WAV por faixa${scene ? ' (' + scene.title + ')' : ''}">${I.dl}Exportar faixas</button>
          <button class="btn" id="exp" ${S.demo || !n ? 'disabled' : ''}>${I.dl}Exportar Reaper</button>
          <button class="btn" id="createall" ${S.demo || busy || d.missing.length ? 'disabled' : ''}>${I.spark}Create todas as cenas</button>
          <button class="btn" id="clear" ${S.demo || busy || !(scene ? sceneClips(scene.n).length : n) ? 'disabled' : ''} title="Apagar todos os sons ${scene ? 'desta cena' : 'do episódio'}">${I.trash}${scene ? 'Limpar cena' : 'Limpar tudo'}</button>
          ${scene ? `<button class="btn blue" id="create" ${S.demo || busy || d.missing.length ? 'disabled' : ''}>${I.spark}${busy ? 'A criar…' : `Create · ${esc(scene.title)}`}</button>` : ''}
        </div></div>
      ${st.status === 'erro' ? `<div class="errbox" style="margin:0 0 16px">${esc(st.message)}</div>` : ''}
      <div class="scn-bar">${chips}</div>
      ${st.note ? `<div class="errbox" style="margin:0 0 16px">${esc(st.note)}</div>` : ''}
      ${scene && d.has_analysis ? (() => {
        const n = String(scene.n), mine = sceneClips(scene.n).length, planned = d.planned[n] || 0, stale = mine && st.sigs && st.sigs[n] && st.sigs[n] !== d.sigs[n];
        const link = `<a href="#/analise/${ST.id}/${scene.n}">Ver e editar os sons desta cena na Análise de Guião</a>`;
        return !mine && planned ? `<p class="st-note" style="margin:0 0 12px">Esta cena tem ${planned} sons escritos na Análise de Guião. Carrega em <b>Create</b> para a montar. ${link}</p>`
          : stale ? `<div class="errbox" style="margin:0 0 12px">A Análise de Guião mudou desde que montaste esta cena. Carrega em <b>Create</b> para a atualizar. ${link}</div>`
          : `<p class="st-note" style="margin:0 0 12px">${link}</p>`;
      })() : ''}
      ${st.mood && st.planner === 'claude' ? `<p class="st-note" style="margin:0 0 12px">Direção sonora (Claude): ${esc(st.mood)}</p>` : ''}
      ${scene ? `<label class="field" style="margin:0 0 16px">Notas para o Claude sobre esta cena (opcional)
        <input type="text" id="snote" maxlength="2000" value="${esc(ST.draft[scene.n] ?? ((st.notes || {})[String(scene.n)] || ''))}" placeholder="Ex.: os polícias NÃO bateram à porta; a cena passa-se de noite" ${S.demo ? 'disabled' : ''}></label>` : ''}
      <div class="card tl">
        <div class="tl-bar"><button class="play" id="tplay" aria-label="Ouvir" ${S.demo ? 'disabled' : ''}>${ST.playing ? I.stop : I.play}</button>
          <span class="tl-time" id="ttime">${fmtT(ST.t)}</span><span class="st-note">${esc(info)}</span><span style="flex:1"></span><span class="st-note" id="stnote">${esc(status)}</span>
          <button class="chip" id="zout" aria-label="Menos zoom">−</button><span class="st-note" id="zlbl" style="min-width:38px;text-align:center">${Math.round(ST.zoom * 100)}%</span><button class="chip" id="zin" aria-label="Mais zoom">+</button></div>
        <div class="tl-scroll" id="tlscroll"><div class="tl-inner" id="tlinner" style="width:calc(170px + (100% - 170px) * ${ST.zoom})">
        <div class="tl-row"><div class="tl-lbl rl" style="height:30px"></div><div class="tl-lane tl-ruler" id="ruler">${ticksHTML()}</div></div>
        <div class="tl-wrap">
          ${scnRow}
          <div class="tl-row" style="height:84px"><div class="tl-lbl"><span class="lt">Narração<small>Takes</small></span>
            <button class="trk-dl" type="button" data-dlnar title="${scene ? 'Descarregar a narração desta cena' : 'Descarregar a narração do episódio (áudio montado)'}" aria-label="Descarregar a narração" ${S.demo ? 'disabled' : ''}>${I.dl}</button></div><div class="tl-lane">${nar}</div></div>
          ${Array.from({ length: SFX_LANES }, (_, k) => row(k, 'Efeitos ' + (k + 1), 'Sound design', 44)).join('')}
          ${st.clips.some(c => c.lane === SFX_LANES) ? row(SFX_LANES, 'Ambiente', 'Sound design', 44) : ''}
          ${row(SFX_LANES + 1, 'Música', 'Sound design', 44)}
          ${st.clips.some(c => c.lane === SFX_LANES + 2) ? row(SFX_LANES + 2, 'Música 2', 'Maestro', 44) : ''}
          <div class="tl-ov"><div class="tl-ph" id="ph" style="left:${pct(ST.t)}%"></div></div>
        </div>
        </div></div>
      </div>
      <div id="selcard"></div>
      <div id="pop"></div>
      ${readingHTML(st, scene)}
      <div id="guidebox"></div>
    </div>`);

  $app.querySelectorAll('[data-clip]').forEach(el => el.onclick = () => { ST.sel = el.dataset.clip; renderStructure(); });
  $app.querySelectorAll('[data-seek]').forEach(el => el.onclick = () => seekStructure(+el.dataset.seek));
  $app.querySelectorAll('[data-scene]').forEach(el => el.onclick = () => chooseScene(+el.dataset.scene));
  document.getElementById('epsel').onchange = e => { stopStructure(true); location.hash = '#/estrutura/' + e.target.value; };
  document.getElementById('ruler').onclick = e => { const r = e.currentTarget.getBoundingClientRect(); seekStructure(ST.v0 + (e.clientX - r.left) / r.width * span); };
  document.getElementById('tplay').onclick = playStructure;
  const sc = document.getElementById('tlscroll'); sc.scrollLeft = keepLeft;
  document.getElementById('zin').onclick = () => applyZoom(ST.zoom * 1.5);
  document.getElementById('zout').onclick = () => applyZoom(ST.zoom / 1.5);
  const card = sc.closest('.tl');
  /* roda do rato: zoom; shift+roda ou deslize horizontal: mover; pinch: zoom */
  card.addEventListener('wheel', e => {
    if (e.ctrlKey || (!e.shiftKey && Math.abs(e.deltaY) > Math.abs(e.deltaX))) {
      e.preventDefault(); applyZoom(ST.zoom * Math.exp(-e.deltaY * (e.ctrlKey ? 0.012 : 0.0035)), e.clientX);
    }
  }, { passive: false });
  card.addEventListener('gesturestart', e => { e.preventDefault(); ST.gz = ST.zoom; });
  card.addEventListener('gesturechange', e => { e.preventDefault(); applyZoom(ST.gz * e.scale, e.clientX); });
  const sn = document.getElementById('snote'); if (sn) sn.oninput = () => { ST.draft[scene.n] = sn.value; };
  const cr = document.getElementById('create'); if (cr) cr.onclick = createStructure;
  document.getElementById('createall').onclick = createAll;
  document.getElementById('clear').onclick = clearScene;
  renderGuide();
  $app.querySelectorAll('.tl-lane[data-lane]').forEach(el => el.onclick = e => {
    if (e.target.closest('.clip') || S.demo) return;
    const r = el.getBoundingClientRect(), t = ST.v0 + (e.clientX - r.left) / r.width * (ST.v1 - ST.v0);
    seekStructure(t);
    ST.add = { lane: +el.dataset.lane, t, x: e.clientX, y: e.clientY }; renderPop();
  });
  renderPop();
  document.getElementById('exp').onclick = () => { if (!S.demo) location.href = `/api/episodes/${ST.id}/export/structure`; };
  const q = scene ? `?scene=${scene.n}` : '';
  document.getElementById('exptr').onclick = () => { if (!S.demo) location.href = `/api/episodes/${ST.id}/export/tracks${q}`; };
  document.querySelector('[data-dlnar]').onclick = () => { if (S.demo) return; scene ? (location.href = `/api/episodes/${ST.id}/export/narration?scene=${scene.n}`) : downloadMontage(); };
  $app.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => { if (!S.demo) location.href = `/api/episodes/${ST.id}/export/track/${b.dataset.dl}${q}`; });
  applyZoom(ST.zoom);
  sc.scrollLeft = keepLeft;
  requestAnimationFrame(() => { const r = document.getElementById('ruler'); if (r) r.innerHTML = ticksHTML(); });
  renderSelected();
}

function readingHTML(st, scene) {
  const rd = scene && (st.readings || {})[String(scene.n)];
  if (!rd || !rd.length) return '';
  return `<details class="card" style="margin-top:20px;padding:16px 20px"><summary style="cursor:pointer;font-weight:600">O que o Claude percebeu nesta cena</summary>
    ${rd.map(x => `<div style="margin-top:14px"><b style="font-size:13px;color:var(--muted)">BLOCO ${x.block}</b>
      ${x.events.length ? `<p class="note" style="margin:4px 0">Acontece: ${x.events.map(esc).join(' · ')}</p>` : ''}
      ${x.not_happening.length ? `<p class="note" style="margin:4px 0;color:var(--warn)">Não acontece (sem som): ${x.not_happening.map(esc).join(' · ')}</p>` : ''}</div>`).join('')}</details>`;
}

async function renderGuide() {
  const box = document.getElementById('guidebox'); if (!box || S.demo) return;
  let g; try { g = await api('/api/sound-guide'); } catch { return; }
  box.innerHTML = `<details class="card" style="margin-top:20px;padding:16px 20px"><summary style="cursor:pointer;font-weight:600">Guia de sound design do Claude${g.custom ? ' (editado)' : ''}</summary>
    <p class="note" style="margin:10px 0">É o método que o Claude segue em todas as cenas. Edita à vontade: densidade de sons, regras de leitura do texto, estilo, música.</p>
    <textarea id="guidetxt" rows="16" style="width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:12px;font:inherit;font-size:14px;color:var(--text);resize:vertical">${esc(g.text)}</textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn blue" id="gsave">Guardar guia</button><button class="btn" id="greset" ${g.custom ? '' : 'disabled'}>Repor o original</button><span class="note" id="gnote" style="align-self:center"></span></div></details>`;
  document.getElementById('gsave').onclick = async () => { await api('/api/sound-guide', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: document.getElementById('guidetxt').value }) }).catch(showErr); document.getElementById('gnote').textContent = 'Guardado.'; };
  document.getElementById('greset').onclick = async () => { if (!confirm('Repor o guia original? As tuas alterações perdem-se.')) return; await api('/api/sound-guide', { method: 'DELETE' }).catch(showErr); renderGuide(); };
}

const LANE_LABEL = k => k < SFX_LANES ? 'Efeitos ' + (k + 1) : k === SFX_LANES ? 'Ambiente' : k === SFX_LANES + 1 ? 'Música' : 'Música 2';
function renderPop() {
  const el = document.getElementById('pop'); if (!el) return;
  const a = ST.add;
  if (!a) { el.innerHTML = ''; return; }
  const kind = a.lane < SFX_LANES ? 'sfx' : a.lane === SFX_LANES ? 'ambience' : 'music', dur = { sfx: 3, ambience: 20, music: 30 }[kind];
  const left = Math.max(8, Math.min(a.x - 20, window.innerWidth - 330)), top = Math.max(8, Math.min(a.y + 12, window.innerHeight - 190));
  el.innerHTML = `<div class="tl-pop" style="left:${left}px;top:${top}px" role="dialog" aria-label="Novo som">
    <b style="font-size:14px">Novo som · ${LANE_LABEL(a.lane)} · ${fmtT(a.t)}</b>
    <input type="text" id="padd" maxlength="300" placeholder="${kind === 'music' ? 'Ex.: piano solo, lento, melancólico' : kind === 'ambience' ? 'Ex.: escritório, chuva na rua' : 'Ex.: máquina de escrever, porta a fechar'}">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)">Duração <input type="number" id="pdur" min="1" max="${kind === 'music' ? 120 : kind === 'ambience' ? 60 : 22}" value="${dur}"> s</label>
    <div style="display:flex;gap:8px"><button class="btn blue" id="pok">${I.spark}Criar</button><button class="btn" id="pcancel">Cancelar</button></div></div>`;
  const inp = document.getElementById('padd'); inp.focus();
  const go = async () => {
    const text = inp.value.trim(); if (!text) return;
    ST.add = null; renderPop();
    try {
      const c = await api(`/api/episodes/${ST.id}/structure/clips`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, kind, start: a.t, dur: +document.getElementById('pdur').value || dur, lane: a.lane }) });
      ST.sel = c.id;
    } catch (e) { alert(e.message); }
    loadStructure();
  };
  inp.onkeydown = e => { if (e.key === 'Enter') go(); else if (e.key === 'Escape') { ST.add = null; renderPop(); } };
  document.getElementById('pok').onclick = go;
  document.getElementById('pcancel').onclick = () => { ST.add = null; renderPop(); };
}

async function deleteSelected() {
  const c = ST.data && ST.data.structure.clips.find(x => x.id === ST.sel); if (!c) return;
  ST.data.structure.clips = ST.data.structure.clips.filter(x => x.id !== c.id); ST.sel = null; renderStructure();
  await api(`/api/episodes/${ST.id}/structure/clips/${c.id}`, { method: 'DELETE' }).catch(e => { showErr(e); loadStructure(); });
}

document.addEventListener('keydown', e => {
  if (location.hash.indexOf('#/estrutura') !== 0 || !ST.data || (e.target.closest && e.target.closest('input,textarea,select')) || e.metaKey || e.ctrlKey || e.altKey) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && ST.sel) { e.preventDefault(); deleteSelected(); }
  else if (e.key === 'Escape') { ST.sel = null; ST.add = null; renderStructure(); }
  else if (e.key === ' ') { e.preventDefault(); if (!S.demo) playStructure(); }
});

function chooseScene(n) {
  stopStructure(true); ST.scene = n; ST.sel = null; ST.zoom = 1; ST.t = 0;
  setView(); ST.t = ST.v0;
  const sc = document.getElementById('tlscroll'); if (sc) sc.scrollLeft = 0;
  renderStructure();
}

function renderSelected() {
  const el = document.getElementById('selcard'), c = ST.data.structure.clips.find(x => x.id === ST.sel);
  if (!el) return;
  if (!c) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="card sel-card">
    <div style="flex:1 1 320px;min-width:0"><p class="section-t" style="margin:0 0 4px">Clip selecionado</p>

      <p class="note" style="margin:2px 0 8px">${c.kind === 'music' ? 'Música' : c.kind === 'ambience' ? 'Ambiente' : 'Efeito'}, ${c.dur.toFixed(1).replace('.', ',')} s, cena ${c.scene}, bloco ${c.block} do guião${c.state === 'erro' ? `<br><span style="color:var(--warn)">${esc(c.message)}</span>` : ''}</p>
      ${c.desc ? `<p style="margin:0 0 6px;font-size:14px">${esc(c.desc)}</p>` : ''}

      <label class="field">Descrição do som (em inglês, é o que a ElevenLabs recebe)<textarea id="cprompt" rows="3" ${S.demo ? 'disabled' : ''}>${esc(c.prompt)}</textarea></label></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-self:flex-end">
      <button class="btn blue" id="cregen" ${S.demo || c.state === 'a gerar' ? 'disabled' : ''}>${I.spark}Regenerar</button>

  document.getElementById('cregen').onclick = async () => {

    loadStructure();
  };
  document.getElementById('clisten').onclick = () => { ST.prev?.pause(); ST.prev = new Audio(`/api/episodes/${ST.id}/structure/clips/${c.id}/audio?v=${Date.now()}`); ST.prev.play().catch(showErr); };
  document.getElementById('cdel').onclick = deleteSelected;
  const g = document.getElementById('cgain');

}

/* narração do episódio todo = áudio montado (o mesmo do AutoTake): monta se ainda não estiver feito */
async function downloadMontage() {
  const note = document.getElementById('stnote'), say = t => { if (note) note.textContent = t; };
  try {
    let ep = await api(`/api/episodes/${ST.id}`);
    if (ep.state.render !== 'pronto') {
      say('A montar a narração do episódio… pode demorar alguns minutos.');
      await api(`/api/episodes/${ST.id}/render`, { method: 'POST' });
      for (;;) {
        await new Promise(r => setTimeout(r, 2500));
        if (location.hash.indexOf('#/estrutura') !== 0) return;
        ep = await api(`/api/episodes/${ST.id}`);
        if (ep.state.render === 'pronto') break;
        if (ep.state.render === 'erro') throw new Error(ep.state.render_message || 'a montagem falhou');
      }
    }
    say('');
    location.href = `/api/episodes/${ST.id}/export/wav`;
  } catch (e) { say(''); showErr(e); alert(e.message); }
}

async function clearScene() {
  const d = ST.data, sc = d.timeline.scenes.find(x => x.n === ST.scene);
  const mine = sc ? d.structure.clips.filter(c => c.scene === sc.n) : d.structure.clips;
  if (!mine.length || !confirm(`Apagar ${mine.length === 1 ? 'o som' : 'os ' + mine.length + ' sons'} ${sc ? 'da ' + sc.title : 'de todas as cenas'}? Não se pode desfazer.`)) return;
  stopStructure(true);
  try { await api(`/api/episodes/${ST.id}/structure/clear`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: sc ? sc.n : 'all' }) }); } catch (e) { alert(e.message); return; }
  ST.sel = null; loadStructure();
}

async function createAll() {
  const d = ST.data, scenes = d.timeline.scenes, missing = scenes.filter(x => !d.structure.clips.some(c => c.scene === x.n));
  const target = missing.length ? missing : scenes, planned = target.reduce((a, x) => a + (d.planned[String(x.n)] || 0), 0);
  const what = missing.length ? `${missing.length} cena(s) sem sons` : 'todas as cenas (substitui os sons que já existem)';
  if (!confirm(`Criar o sound design de ${what}${planned ? `, cerca de ${planned} sons da análise` : ''}? Gasta créditos da ElevenLabs e pode demorar alguns minutos.`)) return;
  stopStructure(true);
  try { await api(`/api/episodes/${ST.id}/structure/create`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: 'all', missing_only: missing.length > 0 }) }); } catch (e) { alert(e.message); return; }
  ST.sel = null; loadStructure();
}

async function createStructure() {
  const sc = ST.data.timeline.scenes.find(x => x.n === ST.scene); if (!sc) return;
  if (ST.data.structure.clips.some(c => c.scene === sc.n) && !confirm(`Isto substitui os sons da ${sc.title} e gasta créditos da ElevenLabs (efeitos e música de fundo). Continuar?`)) return;
  stopStructure(true);
  try { await api(`/api/episodes/${ST.id}/structure/create`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: sc.n, notes: (document.getElementById('snote') || {}).value || '' }) }); } catch (e) { alert(e.message); return; }
  ST.sel = null; loadStructure();
}

/* transporte: narração (takes escolhidos) e sons, sincronizados pelo relógio */
function seekStructure(t) {
  ST.t = Math.max(ST.v0, Math.min(ST.v1, t));
  if (ST.playing) { ST.tBase = ST.t; ST.t0 = performance.now(); stopClips(); }
  movePlayhead();
}
function movePlayhead() {
  const ph = document.getElementById('ph'), tt = document.getElementById('ttime');
  if (ph) ph.style.left = ((ST.t - ST.v0) / (ST.v1 - ST.v0) * 100) + '%';
  if (tt) tt.textContent = fmtT(ST.t);
}
function stopClips() { for (const k in ST.audios) ST.audios[k].pause(); ST.audios = {}; }
function playStructure() {
  if (ST.playing) return stopStructure(true);
  if (ST.t >= ST.v1 - 0.05 || ST.t < ST.v0) ST.t = ST.v0;
  ST.playing = true; ST.tBase = ST.t; ST.t0 = performance.now(); ST.prev?.pause();
  document.getElementById('tplay').innerHTML = I.stop; loopStructure();
}
function stopStructure(redraw) {
  if (!ST.playing && !redraw) return;
  ST.playing = false; cancelAnimationFrame(ST.raf); player.pause(); stopClips();
  const b = document.getElementById('tplay'); if (b) b.innerHTML = I.play;
}
function loopStructure() {
  ST.raf = requestAnimationFrame(() => {
    if (!ST.playing) return;
    const t = ST.t = ST.tBase + (performance.now() - ST.t0) / 1000;
    if (t >= ST.v1) { ST.t = ST.v1; stopStructure(true); movePlayhead(); return; }
    const seg = ST.data.timeline.segments.find(s => t >= s.start && t < s.end);
    if (seg) {
      const want = seg.src + (t - seg.start);
      if (player.paused || Math.abs(player.currentTime - want) > 0.35) { player.currentTime = want; player.play().catch(() => {}); }
    } else if (!player.paused) player.pause();
    for (const c of ST.data.structure.clips) {
      const on = c.state === 'gerado' && t >= c.start && t < c.start + c.dur, a = ST.audios[c.id];
      if (on && !a) { const x = ST.audios[c.id] = new Audio(`/api/episodes/${ST.id}/structure/clips/${c.id}/audio`); x.currentTime = t - c.start; x.volume = Math.min(1, c.gain ?? (c.kind === 'sfx' ? .8 : c.kind === 'ambience' ? .65 : .4)); x.play().catch(() => {}); }
      else if (!on && a) { a.pause(); delete ST.audios[c.id]; }
    }
    movePlayhead();
    const sc = document.getElementById('tlscroll');
    if (sc && ST.zoom > 1) {
      const px = 170 + (ST.t - ST.v0) / (ST.v1 - ST.v0) * (sc.scrollWidth - 170);
      if (px > sc.scrollLeft + sc.clientWidth - 40 || px < sc.scrollLeft + 170) sc.scrollLeft = px - 170 - 60;
    }
    loopStructure();
  });
}

  xhr.upload.onprogress = e => { if (e.lengthComputable) { const p = Math.round(e.loaded / e.total * 100); bar.firstChild.style.width = p + '%'; note.textContent = `A enviar, ${p}%`; } };
