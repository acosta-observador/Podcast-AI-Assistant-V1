<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Podcast Plus AI Assistant</title>
<style>
:root{
  --bg:#ffffff; --panel:#e8f1fb; --card:#edf4fc; --line:rgba(14,34,56,.11); --hover:#d9e7f6;
  --text:#0e2238; --muted:#51677f; --faint:#7d93ab;
  --accent:#0e2238; --accent-soft:rgba(14,34,56,.09); --blue:#2b86dc; --warn:#a85a00; --warn-soft:#e3cfae; --ok:#1f7a38;
  --disc:#dfebf8; --ink:#0e2238; --grey:#8ea6bf;
  --r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.47;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;border-radius:8px}
a{color:var(--accent);text-decoration:none}

/* estrutura com barra lateral */
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:0 0 260px;width:260px;max-width:100%;padding:20px 16px;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;gap:2px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.main{flex:1 1 640px;min-width:0}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;padding:0 12px 14px;color:var(--text)}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.logo i svg{width:16px;height:16px}
.logo span{font-size:14px;line-height:1.2}.logo span em{display:block;font-style:normal;font-weight:400;color:var(--muted)}
.side .back{padding:6px 12px;font-size:14px}
.side .proj-n{padding:10px 12px 4px}.side .proj-n b{display:block;font-size:15px;font-weight:600;line-height:1.3}.side .proj-n span{font-size:13px;color:var(--muted)}
.sec{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin:18px 12px 6px}
.nav-i{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);font-size:15px}
.nav-i svg{width:18px;height:18px;flex:none}
.nav-i:hover{background:var(--hover)}
.nav-i.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.page-t{margin:0 0 6px;font-size:40px;line-height:1.1;font-weight:700;letter-spacing:-.03em}
.page-s{margin:0;font-size:18px;color:var(--muted);max-width:56ch}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px;margin-top:32px}
.pcard{display:flex;flex-direction:column;overflow:hidden;color:var(--text)}
.pcard:hover{border-color:var(--faint);background:var(--hover)}
.pcard .cov{height:140px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.pcard .cov svg{width:56px;height:56px}
.pcard .bd{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px}
.pcard .bd b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em}
.pcard .bd small{color:var(--muted);font-size:14px}
.pcard .pill{align-self:flex-start}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-right:6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:16px}
.fcard{display:flex;flex-direction:column;gap:6px;padding:18px 20px;color:var(--text)}
.fcard:hover{background:var(--hover);border-color:var(--faint)}
.fcard .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.fcard .ico svg{width:20px;height:20px}
.fcard b{font-size:16px;font-weight:600}.fcard span{font-size:14px;color:var(--muted)}
.audio{padding:22px 24px;margin-bottom:32px}
.audio .hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.audio .row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.audio .wv{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:8px}
.wave{display:flex;align-items:center;gap:2px;height:56px}
.wave i{flex:1;border-radius:2px;background:var(--line);transition:background .1s}
.wave i.on{background:var(--blue)}
.tm{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip{height:30px;padding:0 12px;border-radius:980px;background:var(--panel);font-size:13px;font-weight:500}
.chip:hover:not(:disabled){background:var(--hover)}.chip:disabled{opacity:.45}

/* estrutura plus */
.tl{overflow:hidden}
.tl-bar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-bar .play{width:36px;height:36px}.tl-bar .play svg{width:16px;height:16px}
.tl-time{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tl-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.tl-inner{min-width:100%}
.tl-row{display:flex;border-bottom:1px solid var(--line)}
.tl-row:last-child{border-bottom:0}
.tl-lbl{position:sticky;left:0;z-index:3;background:var(--card);width:170px;flex:none;box-sizing:border-box;padding:0 8px 0 14px;display:flex;flex-direction:row;align-items:center;justify-content:space-between;gap:6px;font-size:14px;font-weight:600}
.tl-lbl .lt{display:flex;flex-direction:column;gap:2px;min-width:0}
.trk-dl{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.trk-dl:hover:not(:disabled){background:var(--hover);color:var(--accent)}.trk-dl:disabled{opacity:.3;cursor:default}
.trk-dl svg{width:15px;height:15px}
.tl-lbl small{font-size:12px;color:var(--muted);font-weight:400}
.tl-lane{position:relative;flex:1;min-width:0;border-left:1px solid var(--line);overflow:hidden}
.tl-ruler{height:30px;background:var(--panel);cursor:pointer}
.tl-lbl.rl{background:var(--panel)}
.tl-ruler span{position:absolute;top:7px;padding-left:6px;font-size:11px;color:var(--muted);border-left:1px solid var(--faint);height:16px;line-height:14px;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.tl-wrap{position:relative}
.tl-ov{position:absolute;top:0;bottom:0;left:170px;right:0;pointer-events:none}
.tl-ph{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);margin-left:-1px}
.clip{position:absolute;top:6px;bottom:6px;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:4px 8px;font-size:12px;font-weight:600;white-space:nowrap;text-align:left;cursor:pointer;min-width:6px}
.clip .nm{overflow:hidden;text-overflow:ellipsis}
.clip .bars{display:flex;align-items:center;gap:1px;height:50%}
.clip .bars i{flex:1;border-radius:1px;min-width:1px;background:currentColor;opacity:.7}
.clip.nar{background:var(--accent-soft);color:var(--accent)}
.clip.sfx{background:rgba(255,159,10,.16);color:#c77700}
.clip.mus{background:rgba(125,92,255,.14);color:#6b4cf0}
.clip.amb{background:rgba(48,176,199,.16);color:#1d8a9c}
.clip.sel{box-shadow:0 0 0 2px var(--accent)}
.clip.gen{opacity:.55}.clip.err{background:var(--warn-soft);color:#d70015}
.sel-card{margin-top:20px;padding:20px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.sel-card textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:15px;color:var(--text);resize:vertical}
.scn-bar{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.sc-chip{height:34px;padding:0 14px;border-radius:980px;background:var(--panel);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--text)}
.sc-chip:hover{background:var(--hover)}
.sc-chip.on{background:var(--accent);color:#fff}
.sc-chip svg{width:12px;height:12px;color:var(--ok)}.sc-chip.on svg{color:#fff}
.clip.scn{background:var(--panel);color:var(--text);justify-content:center;align-items:center;text-align:center;top:4px;bottom:4px}
.epsel{height:34px;border-radius:980px;border:1px solid var(--line);background:var(--card);padding:0 12px;font:inherit;font-size:14px;color:var(--text);max-width:100%}
.tl-pop{position:fixed;z-index:50;width:310px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:10px}
.tl-pop input[type=text]{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font:inherit;font-size:15px;color:var(--text);width:100%}
.tl-pop input[type=number]{height:30px;width:64px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font:inherit;color:var(--text)}
.tl-lane[data-lane]{cursor:crosshair}
.an-sc{padding:20px 22px;margin-bottom:16px}
.an-sc h3{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
.an-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 24px}
.an-row{display:contents}
.an-row>div{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.an-head{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:8px 0}
.an-txt{font-size:15px;line-height:1.5}
.an-txt.titulo{font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted)}
.an-txt.nota{font-size:13px;font-style:italic;color:var(--faint)}
.an-txt.entrevista{color:var(--muted);border-radius:8px;background:rgba(255,159,10,.08);padding:8px 10px}
.cue-e{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:start;margin-bottom:10px;padding:10px 12px;border-radius:12px;background:var(--panel)}
.cue-e textarea{grid-column:2;width:100%;border:0;background:transparent;font:inherit;font-size:14px;line-height:1.4;color:var(--text);resize:none;padding:0;min-height:20px}
.cue-e textarea:focus,.cue-e input:focus{outline:2px solid var(--accent-soft);border-radius:6px;background:var(--bg)}
.cue-e .pr{grid-column:2/4;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.cue-e .pr input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted);padding:2px 4px}
.cue-e select{border:0;background:transparent;font:inherit;font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:980px;padding:3px 6px;cursor:pointer}
.cue-e select.sfx{background:rgba(255,159,10,.16);color:#c77700}.cue-e select.ambience{background:rgba(48,176,199,.16);color:#1d8a9c}.cue-e select.music{background:rgba(125,92,255,.14);color:#6b4cf0}
.mp{padding:18px 20px;margin-top:14px}
.mp .hd{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.mp textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;color:var(--text);resize:vertical;min-height:64px;box-sizing:border-box;margin-top:10px}
.mp textarea:focus,.mp input[type=number]:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.mp .row2{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.mp input[type=number]{height:30px;width:70px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0 8px;font:inherit;color:var(--text)}
.mp audio{width:100%;max-width:520px;height:36px}
.rchip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:980px;letter-spacing:.03em;background:rgba(125,92,255,.14);color:#6b4cf0}
.rchip.stem{background:rgba(48,176,199,.16);color:#1d8a9c}.rchip.stinger{background:rgba(255,159,10,.16);color:#c77700}.rchip.transition{background:var(--panel);color:var(--muted)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.gate-in{width:100%;max-width:640px;text-align:center}
.gate-in .logo{justify-content:center;padding:0;margin-bottom:18px}.gate-in .logo i{width:44px;height:44px;border-radius:14px}.gate-in .logo i svg{width:24px;height:24px}
.gate-in h1{margin:0 0 6px;font-size:32px;letter-spacing:-.03em}.gate-in p{margin:0 0 24px;color:var(--muted);font-size:17px}
.gate-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.gate-card{padding:28px 22px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--text)}
.gate-card:hover{border-color:var(--accent);background:var(--accent-soft)}
.gate-card b{font-size:20px;letter-spacing:-.02em}.gate-card span{color:var(--muted);font-size:14px}
.gate-names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.gate-names button{height:64px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:19px;font-weight:600;color:var(--text);cursor:pointer}
.gate-names button:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.who{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:flex;justify-content:space-between;align-items:center;gap:8px}
.who a{color:var(--accent)}
.rv-wrap{max-width:900px;margin:0 auto;padding:32px 20px 80px}
.rv-player{padding:20px 22px}
.rv-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 10px}
.rv-ctl .play{width:48px;height:48px}.rv-ctl .play svg{width:20px;height:20px}
.rv-time{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-width:120px}
.rv-bar{position:relative;height:44px;border-radius:12px;background:var(--panel);cursor:pointer;overflow:hidden;margin:4px 0 6px}
.rv-fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);width:0;pointer-events:none}
.rv-head{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);pointer-events:none;left:0}
.rv-pin{position:absolute;top:6px;width:14px;height:32px;margin-left:-7px;border-radius:7px;background:#ff9f0a;border:2px solid var(--bg);cursor:pointer;padding:0}
.rv-pin.feita{background:var(--ok)}.rv-pin.on{outline:3px solid var(--accent-soft);background:var(--accent)}
.rv-compose{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.rv-compose textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:15px;color:var(--text);resize:vertical;min-height:70px;box-sizing:border-box;margin:8px 0}
.rv-compose textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.rv-note{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:14px 16px;border-top:1px solid var(--line)}
.rv-note:first-child{border-top:0}.rv-note.on{background:var(--accent-soft)}.rv-note.feita .rv-text{color:var(--muted);text-decoration:line-through}
.rv-t{height:30px;padding:0 12px;border-radius:980px;background:var(--panel);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
.rv-t:hover{background:var(--hover)}
.rv-au{font-weight:600;font-size:13px}.rv-text{font-size:15px;margin-top:2px;white-space:pre-wrap}
.rv-reply{margin-top:8px;padding:8px 12px;border-radius:10px;background:var(--panel);font-size:14px}
.rv-act{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rv-act button{font-size:13px;color:var(--accent);padding:4px 8px;border-radius:8px}.rv-act button:hover{background:var(--hover)}
.rv-now{min-height:0;margin:2px 0 8px;padding:0}
.rv-now div{padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--text);font-size:15px;cursor:pointer}
.rv-now b{color:var(--accent)}
.rv-near{margin:8px 0 0;display:flex;flex-direction:column;gap:8px}
.rv-near .hd{font-size:13px;color:var(--muted)}
.rv-near .it{padding:10px 12px;border-radius:12px;background:var(--panel);font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.rv-agree{height:32px;padding:0 12px;border-radius:980px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;color:var(--accent)}
.rv-agree.on{background:var(--accent);border-color:var(--accent);color:#fff}
.rv-mine{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px}
@media (max-width:640px){
  .rv-wrap{padding:16px 12px 120px}
  .rv-wrap h1{font-size:24px!important}
  .rv-player{padding:14px}
  .rv-ctl{justify-content:center;gap:12px;margin:12px 0 6px}
  .rv-ctl .play{width:68px;height:68px;order:2}.rv-ctl .play svg{width:26px;height:26px}
  #rvb10{order:1;height:44px;padding:0 16px}#rvf10{order:3;height:44px;padding:0 16px}
  .rv-time{order:4;flex-basis:100%;text-align:center;font-size:17px}
  #rvspd{order:5}
  .rv-bar{height:64px;border-radius:14px}
  .rv-pin{top:8px;width:22px;height:48px;margin-left:-11px;border-radius:11px}
  .rv-hint{display:none}
  .rv-compose{position:fixed;left:0;right:0;bottom:0;z-index:20;margin:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.08)}
  .rv-compose textarea{font-size:16px;min-height:56px;margin:6px 0}
  .rv-compose .btn{height:44px;width:100%;justify-content:center}
  .rv-compose .rv-near{max-height:30vh;overflow:auto}
  .rv-note{grid-template-columns:auto 1fr;padding:14px 12px}
  .rv-act{grid-column:1/-1;justify-content:flex-start}
  .rv-act button{padding:10px 12px;font-size:14px}
  .rv-t{height:38px;padding:0 14px;font-size:14px}
  .rv-agree{height:38px}
  .top-actions span{display:none}
  .top-in{display:flex!important;justify-content:space-between;padding:0 14px}
  .top-actions{flex:none}
}
.tape{--bg1:#ffffff;--bg2:#e8f1fb;--disc:#dfebf8;--ink:#0e2238;--grey:#8ea6bf;background:var(--bg1);min-height:100vh;margin:0 -12px;padding:20px 20px 40px;color:var(--ink);color-scheme:light}
.tape *{letter-spacing:-.01em}
.tape-title{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tape-title h1{margin:0;font-size:34px!important;line-height:1.05;font-weight:800;letter-spacing:-.04em;color:var(--ink)}
.tape-title h1 .g{display:block;color:var(--grey)}
.tape-ver{height:34px;border-radius:980px;border:1px solid rgba(0,0,0,.2);background:transparent;padding:0 10px;font:inherit;font-size:13px;color:var(--ink);max-width:42vw}
.reels{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:18px 0 8px}
.reel{aspect-ratio:1;border-radius:50%;background:var(--disc);display:grid;place-items:center}
.reel svg{width:100%;height:100%;animation:reelspin 2.4s linear infinite;animation-play-state:paused}
.reel.rev svg{animation-direction:reverse}
.playing .reel svg{animation-play-state:running}
@keyframes reelspin{to{transform:rotate(360deg)}}
.tape-track{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:14px 0 6px;text-align:center}
.tape-track b{display:block;font-size:17px;font-weight:800}.tape-track small{color:var(--grey);font-size:14px}
.tape-ic{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:50%;position:relative}
.tape-ic svg{width:22px;height:22px}
.tape-ic em{position:absolute;top:2px;right:0;font-style:normal;font-size:11px;font-weight:800;background:#ff9f0a;color:#111;border-radius:980px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

.tape-wave canvas{position:absolute;inset:0;width:100%;height:100%}
.tape .rv-head{width:2px;background:var(--blue);top:6px;bottom:6px}
.tape .rv-pin{top:6px;bottom:6px;height:auto;width:12px;margin-left:-6px;border-radius:6px;background:rgba(255,159,10,.85);border:0}

.tape-time{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 12px}
.tape-time .tbtn{height:36px;padding:0 14px;border-radius:980px;background:rgba(0,0,0,.08);color:var(--ink);font-size:13px;font-weight:700}
.tape-time select{height:36px;border-radius:980px;border:0;background:rgba(0,0,0,.08);padding:0 10px;font:inherit;font-size:13px;font-weight:700;color:var(--ink)}
.tape .rv-now div{background:rgba(0,0,0,.08);color:var(--ink)}.tape .rv-now b{color:var(--ink)}
.knobs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
.kpan{background:var(--bg2);border-radius:26px;padding:14px;display:grid;place-items:center}
.knob{position:relative;width:100%;aspect-ratio:1;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;padding:0}
.knob .tick{position:absolute;left:50%;top:10%;width:4px;height:16%;margin-left:-2px;border-radius:2px;background:var(--disc);transform-origin:50% 310%}
.playing .knob.k1 .tick{animation:reelspin 6s linear infinite}
.knob .kic{position:absolute;inset:0;display:grid;place-items:center;color:var(--disc)}
.knob .kic svg{width:34%;height:34%}
.knob em{display:block;font-style:normal;font-size:13px;font-weight:700;margin-top:4px}
.knob.k2 .kic svg{width:46%;height:46%}
.tape .rv-compose{border-top:0}
.tape-notes{margin:22px -8px 0;background:var(--bg2)!important;border:0!important;border-radius:22px;overflow:hidden;color:var(--ink)}
.tape-notes .rv-note{border-top:1px solid rgba(0,0,0,.1)}.tape-notes .rv-t{background:rgba(0,0,0,.1);color:var(--ink)}
.tape-notes .rv-text{color:var(--ink)}.tape-notes .note,.tape-notes .rv-au{color:var(--ink)}
.tape-notes .rv-reply{background:rgba(0,0,0,.08)}
.tape-notes .chip{background:rgba(0,0,0,.1);color:var(--ink)}.tape-notes .chip.on{background:var(--accent);color:#fff}
.tape-sheet{position:fixed!important;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);transition:transform .26s var(--ease-drawer);background:var(--card)!important;color:var(--text)!important;border-radius:22px 22px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))!important;box-shadow:0 -12px 40px rgba(0,0,0,.25)}
.tape-sheet.open{transform:none}
.rv-wrap.wide{max-width:1120px}
.tape{--pad:20px}
.tape-wave{margin-left:calc(var(--pad) * -1)!important;margin-right:calc(var(--pad) * -1)!important}
.tape-hint{margin:14px 0 0;font-size:13px;color:var(--grey);display:none}
.tape-nh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:16px 18px}
.tape-sub{font-size:13px;color:rgba(0,0,0,.55);flex:1;min-width:120px}
@media (min-width:641px){
  .tape{--pad:34px;margin:0 auto;max-width:1120px;border-radius:34px;padding:34px;min-height:0}

  .tape:not(.cols) .tape-notes{margin-top:22px!important}

  .tape-notes{margin:0!important;overflow:auto}

  .tape-wave{height:128px;margin-left:0!important;margin-right:0!important}
}

.snd-wrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.snd{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 6px 5px 12px;border-radius:980px;background:var(--panel);border:1px solid var(--line);font-size:14px;line-height:1.3}

.snd .x{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.snd .x:hover{background:var(--warn-soft);color:#d70015}
.snd .x svg{width:12px;height:12px}
.snd-add{height:32px;min-width:150px;flex:1 1 150px;border:1px dashed var(--line);border-radius:980px;background:transparent;padding:0 12px;font:inherit;font-size:14px;color:var(--text)}
.snd-add:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--bg)}
.an-lines{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font:inherit;font-size:14px;line-height:1.45;color:var(--text);resize:vertical;min-height:46px;box-sizing:border-box}

@media (max-width:900px){.an-grid{grid-template-columns:1fr}.an-row>div:first-child{border-bottom:0;padding-bottom:0}.an-row>div:last-child{border-top:0;padding-top:4px}}

.an-cue .del:hover{background:var(--warn-soft);color:#d70015}

.kchip.sfx{background:rgba(255,159,10,.16);color:#c77700}.kchip.amb{background:rgba(48,176,199,.16);color:#1d8a9c}.kchip.mus{background:rgba(125,92,255,.14);color:#6b4cf0}

.itag.narracao{background:var(--accent-soft);color:var(--accent)}.itag.entrevista{background:rgba(255,159,10,.16);color:#c77700}
.st-note{font-size:13px;color:var(--muted)}

/* barra de topo */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;height:52px;padding:0 20px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{font-weight:600;font-size:15px;color:var(--text);white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
.back{display:inline-flex;align-items:center;gap:4px;font-size:15px;color:var(--accent)}
.back svg{width:18px;height:18px}
.top-title{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.top-actions{display:flex;justify-content:flex-end;gap:8px}

.btn{height:32px;padding:0 14px;border-radius:980px;font-size:14px;font-weight:500;background:var(--panel);color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--hover)}
.btn:disabled{opacity:.45}
.btn.blue{background:var(--accent);color:#fff}
.btn.blue:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn svg{width:16px;height:16px}
.link{color:var(--accent);font-size:14px}
.link:disabled{color:var(--faint)}

.wrap{max-width:1180px;margin:0 auto;padding:36px 20px 80px}
.intro h1{font-size:34px;line-height:1.12;font-weight:700;letter-spacing:-.025em;margin:0 0 6px}
.intro p{font-size:17px;color:var(--muted);margin:0 0 32px;max-width:56ch}

/* cartões */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.section-t{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px 4px}

/* lista de episódios */
.eps{overflow:hidden}
.ep-row{display:flex;align-items:center;border-top:1px solid var(--line)}
.ep-row:first-child{border-top:0}
.ep-row:hover{background:var(--panel)}
.ep{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:4px 16px;padding:14px 18px;color:var(--text)}
.ep-del{flex:none;width:36px;height:36px;margin-right:12px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;color:var(--faint);cursor:pointer}
.ep-del:hover,.ep-del:focus-visible{background:var(--warn-soft);color:#d70015}
.ep-del svg{width:18px;height:18px}
.ep b{font-weight:600;font-size:16px}
.ep small{color:var(--muted);font-size:13px}
.ep .pill{grid-row:1/3;grid-column:2;align-self:center}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
.empty{padding:40px 24px;text-align:center;color:var(--muted)}

/* formulário */
form.new{padding:20px;display:flex;flex-direction:column;gap:14px}
form.new h2{margin:0;font-size:19px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.field input[type=text]{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;font-size:15px;color:var(--text)}
.field input[type=text]:focus{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.drop{position:relative;border:1.5px dashed var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;background:var(--bg)}
.drop:hover{border-color:var(--faint)}

.primary{height:44px;border-radius:12px;background:var(--accent);color:#fff;font-size:16px;font-weight:600}

.note{font-size:13px;color:var(--muted);margin:0}

/* processamento */
.proc{max-width:520px;margin:40px auto;padding:28px}
.proc h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.proc > p{color:var(--muted);margin:0 0 22px}
.stage{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--faint);font-size:16px}

@keyframes spin{to{transform:rotate(360deg)}}
.errbox{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn)}

/* ===== desenho gravador de fita em toda a app ===== */

.side{background:var(--panel);border-right:0}
.logo i{background:var(--accent);color:#fff;border-radius:50%}
.logo span{font-weight:800;letter-spacing:-.03em}.logo span em{color:var(--grey);font-weight:800}

.page-s,.intro p{color:var(--muted)}

.fcard .ico{background:var(--accent);color:#fff;border-radius:50%}
.btn{background:rgba(0,0,0,.1);color:var(--ink);font-weight:700}

.btn.blue,.primary{background:var(--accent);color:#fff}

.primary{border-radius:980px}
.chip,.sc-chip{background:rgba(0,0,0,.09);color:var(--ink);font-weight:700}

/* ---------- Polimento (princípios de Emil Kowalski) ---------- */
:root{--ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1)}
/* tudo o que se carrega responde ao toque */
.btn,.chip,.tbtn,.knob,.play,.primary,.nav-i,.tb-send,.tape-ic,.tape-x,.sc-chip,.rv-agree,.epc-l a,.back{transition:transform .16s var(--ease-out),background-color .16s ease,color .16s ease,opacity .16s ease}
.btn:active,.chip:active,.tbtn:active,.knob:active,.play:active,.primary:active,.tb-send:active,.tape-ic:active,.tape-x:active,.sc-chip:active,.rv-agree:active,.epc-l a:active{transform:scale(.96)}
.nav-i:active{transform:scale(.985)}
.pcard,.fcard,.epc,.gate-card,.ep-row{transition:transform .2s var(--ease-out),background-color .16s ease,box-shadow .2s var(--ease-out)}
.pcard:active,.fcard:active,.epc:active,.gate-card:active{transform:scale(.985)}
/* hover só onde há rato; no telemóvel o toque não deixa estados presos */
@media (hover:hover) and (pointer:fine){.epc:not(.epc-empty):hover{box-shadow:0 8px 24px rgba(14,34,56,.08);transform:translateY(-1px)}}
/* entrada escalonada (30-50 ms) dos cartões da Visão geral */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.epg>.epc{animation:rise .3s var(--ease-out) both}
.epg>.epc:nth-child(2){animation-delay:40ms}.epg>.epc:nth-child(3){animation-delay:80ms}.epg>.epc:nth-child(4){animation-delay:120ms}.epg>.epc:nth-child(5){animation-delay:160ms}.epg>.epc:nth-child(6){animation-delay:200ms}
/* a gaveta das notas: entra com a curva do iOS, sai mais depressa */
.rv-wrap.dir .tape-side:not(.open){transition-duration:.2s}
/* caixas: definição suave sobre o fundo branco */
.card,.tape-notes,.kpan{box-shadow:0 1px 0 rgba(14,34,56,.04)}
</style>

<body>
<div id="app"></div>
<audio id="player" preload="none"></audio>

<script>
/* ---------- ícones ---------- */
const I = {
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.2v13.6c0 .8.9 1.3 1.6.8l10.2-6.8c.6-.4.6-1.2 0-1.6L9.6 4.4C8.9 3.9 8 4.4 8 5.2z"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6.5" y="6.5" width="11" height="11" rx="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h1M7.5 9v6M11 5v14M14.5 8v8M18 10.5v3M20.5 12h-.5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>',
  layers:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>',
  logo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 10v4M9 6v12M13 9v6M17 4v16M21 11v2"/></svg>',
  spark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg>',
  music:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4z"/><path d="M8 8h8M8 12h5"/></svg>',
  dl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
};

/* ---------- estado ---------- */
const S = { demo:false, list:[], ep:null, cur:0, playing:false, poll:null };
const $app = document.getElementById('app');
const player = document.getElementById('player');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h+':'+String(m).padStart(2,'0') : String(m)) + ':' + String(x).padStart(2,'0'); };
const capital = s => s ? s[0].toUpperCase() + s.slice(1) : s;

async function api(path, opts = {}) {
  if (S.demo) return Demo.api(path, opts);
  const r = await fetch(path, opts);
  if (!r.ok) { let m = r.statusText; try { m = (await r.json()).detail || m } catch {} throw new Error(m); }
  return r.headers.get('content-type')?.includes('json') ? r.json() : r.text();
}

/* ---------- navegação ---------- */
window.addEventListener('hashchange', route);
async function route() {
  stopAudio(); clearTimeout(S.poll); stopStructure(); clearTimeout(ST.poll); clearTimeout(AN.poll); clearTimeout(MA.poll); clearTimeout(RV.poll); stopReviewAudio(); player.onloadedmetadata = player.ontimeupdate = player.onpause = player.onplay = null; if (!player.paused) player.pause();
  const role = getRole();
  if (!role) return gatePage();
  if (role.mode === 'direcao' && !/^#\/(direcao|revisao)/.test(location.hash)) { location.hash = '#/direcao'; return; }
  const mr = location.hash.match(/^#\/revisao\/([\w-]+)(?:\/(v\d+))?/);
  if (mr) return reviewPage(mr[1], mr[2]);
  if (location.hash === '#/direcao') return role.mode === 'direcao' ? directorHome() : (location.hash = '#/notas', undefined);
  if (location.hash === '#/notas') return notesHome();
  const m = location.hash.match(/^#\/ep\/([\w-]+)/);
  if (m) return openEpisode(m[1]);
  if (location.hash === '#/projeto') return projectPage();
  if (location.hash === '#/autotake') return home();
  const mm = location.hash.match(/^#\/maestro(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (mm) return maestroPage(mm[1], mm[2] ? +mm[2] : null);
  const ma = location.hash.match(/^#\/analise(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (ma) return analisePage(ma[1], ma[2] ? +ma[2] : null);
  const me = location.hash.match(/^#\/estrutura(?:\/([\w-]+))?(?:\/(\d+))?$/);
  if (me) return estruturaPage(me[1], me[2] ? +me[2] : null);
  return projectsPage();
}

function topbar({ left, title = '', actions = '' }) {
  return `<div class="top"><div class="top-in">
    <div>${left}</div><div class="top-title">${esc(title)}</div><div class="top-actions">${actions}</div>
  </div></div>${S.demo ? '<div class="banner">Demonstração: os dados são fictícios e não há áudio. No servidor, o upload e a transcrição funcionam a partir desta página.</div>' : ''}`;
}
const brand = `<b class="brand">AutoTake</b>`;
const backLink = `<a class="back" href="#/autotake">${I.chevL}Episódios</a>`;

const PROJECT = { name: 'As Sombras de Duarte Lima', total: 6 };
function side(active) {

async function loadAnalysis() {
  clearTimeout(AN.poll);
  try { AN.data = await api(`/api/episodes/${AN.id}/analysis`); }
  catch (e) { $app.innerHTML = shell('analise', `<div class="wrap"><div class="errbox">${esc(e.message)}</div></div>`); return; }
  const running = anRunning(AN.data.analysis), a = document.activeElement;
  const typing = a && a.matches && a.matches('input.snd-add, [contenteditable], textarea');
  if (!typing || (AN.wasRunning && !running)) renderAnalysis();
  AN.wasRunning = running;
  if (running) AN.poll = setTimeout(loadAnalysis, 3000);
}

const X_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function lineParts(raw) {
  let t = raw.trim().replace(/^[-•*·]\s*/, ''), kind = 'sfx';
  const m = t.match(/^(m[úu]sica|music)\s*:\s*/i);
  if (m) { kind = 'music'; t = t.slice(m[0].length); }
  const i = t.indexOf('@');
  return { kind, text: (i >= 0 ? t.slice(0, i) : t).trim(), anchor: i >= 0 ? t.slice(i + 1).trim() : '' };
}
const buildLine = p => (p.kind === 'music' ? 'música: ' : '') + p.text + (p.anchor ? ' @ ' + p.anchor : '');
const linesOf = (an, id) => ((an.lines || {})[String(id)] || '').split('\n').filter(l => l.trim());
function cellHTML(an, id) {
  const chips = linesOf(an, id).map((raw, i) => { const p = lineParts(raw);
    return `<span class="snd ${p.kind}" data-i="${i}" ${p.anchor ? `title="Entra em: ${esc(p.anchor)}"` : ''}>${p.kind === 'music' ? '♪' : ''}<span class="st" contenteditable="${S.demo ? 'false' : 'plaintext-only'}" spellcheck="false">${esc(p.text)}</span><button class="x" type="button" aria-label="Remover ${esc(p.text)}" ${S.demo ? 'disabled' : ''}>${X_SVG}</button></span>`; }).join('');
  return chips + (S.demo ? '' : `<input class="snd-add" type="text" maxlength="300" placeholder="+ som (Enter)" aria-label="Acrescentar som">`);
}
async function saveLines(an, id, arr) {
  (an.lines = an.lines || {})[String(id)] = arr.join('\n');
  await api(`/api/episodes/${AN.id}/analysis/lines`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ item: id, text: arr.join('\n') }) }).catch(showErr);
}
function bindCell(an, w) {
  const id = +w.dataset.item, redraw = (focusAdd) => { w.innerHTML = cellHTML(an, id); bindCell(an, w); if (focusAdd) w.querySelector('.snd-add')?.focus(); };
  w.querySelectorAll('.snd').forEach(chip => {
    const i = +chip.dataset.i, st = chip.querySelector('.st');
    chip.querySelector('.x').onclick = async () => { const arr = linesOf(an, id); arr.splice(i, 1); await saveLines(an, id, arr); redraw(); };
    st.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); st.blur(); } };
    st.onblur = async () => {
      const arr = linesOf(an, id), p = lineParts(arr[i]), text = st.textContent.replace(/\s+/g, ' ').trim();
      if (text === p.text) return;
      if (!text) arr.splice(i, 1); else arr[i] = buildLine({ ...p, text });
      await saveLines(an, id, arr); redraw();
    };
  });
  const add = w.querySelector('.snd-add');
  if (add) add.onkeydown = async e => {
    if (e.key !== 'Enter' || !add.value.trim()) return;
    e.preventDefault();
    const arr = linesOf(an, id); arr.push(add.value.trim());
    await saveLines(an, id, arr); redraw(true);
  };
}

function renderAnalysis() {
  const d = AN.data, an = d.analysis, busy = anRunning(an), scenes = an.scenes || [];
  const sc = AN.scene ? scenes.find(x => x.n === AN.scene) : null;
  const visible = s => (an.items || []).filter(it => it.id >= s.from && it.id <= s.to && (it.type === 'narracao' || it.type === 'entrevista'));
  const soundsIn = s => visible(s).reduce((a, it) => a + nLines((an.lines || {})[String(it.id)]), 0);
  const epOpts = S.list.map(e => `<option value="${e.id}" ${e.id === AN.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('');
  const total = scenes.reduce((a, s) => a + soundsIn(s), 0);

    : '';
  const errs = Object.entries(an.errors || {}).map(([n, m]) => `<div class="errbox" style="margin:0 0 12px">Cena ${n}: ${esc(m)}</div>`).join('');
  const head = `<div class="ep-head"><div><h1 class="page-t">Análise de Guião</h1>
      <p class="page-s">${sc ? `Cena ${sc.n}: ${esc(sc.title)}` : 'As cenas do guião. Abre uma cena para ver os parágrafos e escrever, ao lado, os sons a ir buscar à ElevenLabs.'}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <select class="epsel" id="anep" aria-label="Episódio">${epOpts}</select>
        ${sc ? '' : `<button class="btn blue" id="anall" ${S.demo || busy || !d.claude ? 'disabled' : ''}>${I.spark}${busy ? 'A sugerir…' : 'Sugerir sons para as cenas'}</button>`}
      </div></div>
      ${status ? `<p class="st-note" style="margin:0 0 16px">${esc(status)}</p>` : ''}${errs}
      ${an.status === 'erro' ? `<div class="errbox" style="margin:0 0 16px">${esc(an.message)}</div>` : ''}`;

  if (!sc) {
    $app.innerHTML = shell('analise', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios.</div>' : ''}<div class="wrap">${head}
      <p class="st-note" style="margin:0 0 16px">${scenes.length} cenas, ${total} sons escritos. A Estrutura Plus vai buscar estes sons e monta a linha do tempo.</p>
      <div class="projs" style="margin-top:0">${scenes.map(s => { const np = visible(s).filter(it => it.type === 'narracao').length, ns = soundsIn(s); return `
        <a class="card fcard" href="#/analise/${AN.id}/${s.n}"><b style="font-size:13px;color:var(--muted);letter-spacing:.04em">CENA ${s.n}</b>
          <b style="font-size:17px;line-height:1.3">${esc(s.title)}</b>
          <span>${np} parágrafos · ${ns ? `<b style="color:var(--accent)">${ns} sons</b>` : 'sem sons ainda'}</span></a>`; }).join('')}</div></div>`);
    document.getElementById('anall').onclick = async () => {
      const missing = scenes.filter(s => soundsIn(s) === 0).length, replace = missing === 0;
      if (replace && !confirm('Todas as cenas já têm sons. Voltar a pedir sugestões substitui o que lá está, incluindo as tuas edições. Continuar?')) return;
      try { await api(`/api/episodes/${AN.id}/analysis/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: 'all', replace }) }); } catch (e) { alert(e.message); return; }
      loadAnalysis();
    };
  } else {
    const rows = visible(sc).map(it => it.type === 'entrevista'
      ? `<div class="an-row"><div><span class="itag entrevista">ENTREVISTA${it.speaker ? ' · ' + esc(it.speaker.replace(/^[…. ]+/, '').slice(0, 40)) : ''}</span>
          <div class="an-txt entrevista" style="margin-top:6px">${esc(it.text.length > 600 ? it.text.slice(0, 600) + '…' : it.text)}</div></div><div><span class="note">Sem sons por cima da entrevista.</span></div></div>`
      : `<div class="an-row"><div><div class="an-txt">${esc(it.text)}</div></div>
          <div class="snd-wrap" data-item="${it.id}">${cellHTML(an, it.id)}</div></div>`).join('');
    $app.innerHTML = shell('analise', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios.</div>' : ''}<div class="wrap">
      <p style="margin:0 0 12px"><a class="back" href="#/analise/${AN.id}">${I.chevL}Todas as cenas</a></p>${head}
      <div class="card an-sc">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <label class="field" style="flex:1 1 320px;margin:0">Notas para o Claude sobre esta cena (opcional)
            <input type="text" id="anote" maxlength="2000" value="${esc((an.notes || {})[String(sc.n)] || '')}" placeholder="Ex.: os polícias NÃO bateram à porta" ${S.demo ? 'disabled' : ''}></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="anclr" ${S.demo || busy || !soundsIn(sc) ? 'disabled' : ''} title="Apagar os sons escritos desta cena">${I.trash}Limpar sons</button>
            <button class="btn" id="ansug" ${S.demo || busy || !d.claude ? 'disabled' : ''} title="O Claude acrescenta sons sem apagar os que já escreveste">${I.spark}Sugerir sons</button>
            <a class="btn blue" href="#/estrutura/${AN.id}/${sc.n}">${I.layers}Montar na Estrutura Plus</a></div></div>
        <p class="note" style="margin:12px 0 0">Em cada parágrafo escreve um som e carrega em <b>Enter</b> (português ou inglês). Clica num som para o editar; o <b>✕</b> apaga-o.
          Opcional: <b>@ palavras do texto</b> no fim para escolher onde entra (ex.: <i>porta pesada a fechar @ A sede da Polícia</i>) e <b>música:</b> no início para pedir música. Guarda sozinho.</p>
        <div class="an-grid" style="margin-top:12px"><div class="an-head">PARÁGRAFOS</div><div class="an-head">SONS A IR BUSCAR À ELEVENLABS</div>${rows}</div></div></div>`);
    $app.querySelectorAll('.snd-wrap').forEach(w => bindCell(an, w));
    document.getElementById('anclr').onclick = async () => {
      if (!soundsIn(sc) || !confirm(`Apagar os ${soundsIn(sc)} sons escritos nesta cena? Não se pode desfazer.`)) return;
      try { await api(`/api/episodes/${AN.id}/analysis/clear`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: sc.n }) }); } catch (e) { alert(e.message); return; }
      loadAnalysis();
    };
    document.getElementById('ansug').onclick = async () => {
      try { await api(`/api/episodes/${AN.id}/analysis/run`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ scene: sc.n, notes: document.getElementById('anote').value }) }); } catch (e) { alert(e.message); return; }

    };
  }
  document.getElementById('anep').onchange = e => { location.hash = '#/analise/' + e.target.value + (sc ? '/' + sc.n : ''); };

    xhr.open('POST', '/api/review/episodes');
    xhr.upload.onprogress = ev => { if (ev.lengthComputable) note.textContent = `A carregar, ${Math.round(ev.loaded / ev.total * 100)}%`; };
    xhr.onload = () => {
      if (xhr.status < 300) { const r = JSON.parse(xhr.responseText); note.textContent = 'Carregado. A converter…'; location.hash = `#/revisao/${r.episode}`; }
      else { let m = 'O envio falhou.'; try { m = JSON.parse(xhr.responseText).detail } catch {} note.textContent = m; }
    };
    xhr.onerror = () => { note.textContent = 'O envio falhou. Verifica a ligação.'; };
    xhr.send(fd);
  };
}

function bindTape(ver) {
  const a = document.getElementById('rvaudio'), tape = document.getElementById('rvtape'), cv = document.getElementById('rvcanvas'), wave = document.getElementById('rvbar');
  const peaks = (ver.peaks && ver.peaks.length) ? ver.peaks : Array.from({ length: 160 }, (_, i) => 20 + 30 * Math.abs(Math.sin(i * .4)));
  const draw = () => {
    const w = wave.clientWidth, h = wave.clientHeight, r = window.devicePixelRatio || 1;
    if (!w) return; cv.width = w * r; cv.height = h * r;
    const c = cv.getContext('2d'); c.scale(r, r); c.clearRect(0, 0, w, h);
    const dur = (a.duration && isFinite(a.duration)) ? a.duration : (ver.duration || 1), p = (RV.scrubT ?? (a.currentTime || 0)) / dur, n = Math.floor(w / 5);
    const scs = ver.scenes || [];
    scs.forEach((sc, k) => {
      const x0 = sc.start / dur * w, x1 = (scs[k + 1] ? scs[k + 1].start : dur) / dur * w;
      if (k % 2 === 0) { c.fillStyle = 'rgba(0,0,0,.07)'; c.fillRect(x0, 0, x1 - x0, h); }
      c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(x0, 0, 1.5, h);
      if (x1 - x0 > 26) { c.fillStyle = '#111'; c.font = '700 11px -apple-system,system-ui,sans-serif'; c.textBaseline = 'alphabetic'; c.fillText('C' + sc.n, x0 + 6, h - 6); }
    });
    for (let i = 0; i < n; i++) {
      const v = peaks[Math.min(peaks.length - 1, Math.floor(i / n * peaks.length))] / 100, bh = Math.max(4, v * (h - 16));
      c.fillStyle = i / n <= p ? '#2b86dc' : '#8ea6bf'; c.fillRect(i * 5 + 1, (h - bh) / 2, 3, bh);
    }
  };
  RV.tapeDraw = draw; draw(); window.addEventListener('resize', draw, { once: true });
  const base = a.onplay; a.onplay = a.onpause = () => { base(); tape.classList.toggle('playing', !a.paused); };
  a.addEventListener('timeupdate', () => RV.tapeDraw && RV.tapeDraw()); a.addEventListener('loadedmetadata', () => draw());
  const sheet = document.getElementById('rvsheet'), txt = document.getElementById('rvtxt');
  if (sheet) {
    document.getElementById('rvnoteknob').onclick = () => txt.focus();
  } else {
    document.getElementById('rvnoteknob').onclick = () => {       // Sonoplastia: salta para a nota seguinte
      const ns = RV.data.review.notes.filter(x => x.version === ver.id).sort((x, y) => x.t - y.t); if (!ns.length) return;
      const nx = ns.find(x => x.t > (a.currentTime || 0) + 0.5) || ns[0]; a.currentTime = Math.max(0, nx.t - 1); RV.active = nx.id;
      document.querySelector(`[data-n="${nx.id}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    };
  }
  const side = document.getElementById('rvside'), compact = () => sheet && isMobile();
  document.getElementById('rvnotesbtn').onclick = () => { if (compact()) side.classList.toggle('open'); else document.getElementById('rvnotesbox').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  document.getElementById('rvnclose').onclick = () => side.classList.remove('open');
  // arrastar na forma de onda = andar na fita
  // arrastar a fita: durante o gesto só mexe a imagem (o áudio salta uma vez, ao largar), senão o iPhone engasga a tocar
  let drag = null;
  const scrubTo = e => { const dur = a.duration || ver.duration || 1; RV.scrubT = Math.max(0, Math.min(dur, drag.t + (e.clientX - drag.x) / wave.clientWidth * dur)); RV.tick && RV.tick(); draw(); };
  wave.addEventListener('pointerdown', e => { drag = { x: e.clientX, t: a.currentTime, moved: false }; wave.setPointerCapture(e.pointerId); });
  wave.addEventListener('pointermove', e => { if (!drag) return; if (Math.abs(e.clientX - drag.x) > 6) drag.moved = true; if (drag.moved) scrubTo(e); });
  const endDrag = () => { if (!drag) return; if (RV.scrubT != null) { a.currentTime = RV.scrubT; RV.scrubT = null; RV.tick && RV.tick(); draw(); } drag = null; };
  wave.addEventListener('pointerup', endDrag); wave.addEventListener('pointercancel', endDrag);
  const badge = () => { const n = RV.data.review.notes.filter(x => x.version === ver.id && x.status !== 'feita').length; document.getElementById('rvbadge').textContent = n; document.getElementById('rvbadge').style.display = n ? '' : 'none'; };
  badge(); setInterval(() => { if (document.getElementById('rvbadge')) badge(); }, 1500);
}

function bindPlayer(ver) {
  const role = getRole(), a = document.getElementById('rvaudio'), bar = document.getElementById('rvbar');
  const dur = () => (a.duration && isFinite(a.duration)) ? a.duration : (ver.duration || 1);
  const notes = () => RV.data.review.notes.filter(n => n.version === ver.id).sort((x, y) => x.t - y.t);
  const paintPins = () => { document.getElementById('rvpins').innerHTML = notes().map(n => `<button class="rv-pin ${n.status === 'feita' ? 'feita' : ''} ${RV.active === n.id ? 'on' : ''}" style="left:${Math.min(100, n.t / dur() * 100)}%;--c:${DCOL[n.author] || '#111'}" data-pin="${n.id}" title="${mmss(n.t)} · ${esc(n.author)}: ${esc(n.text.slice(0, 80))}" aria-label="Nota aos ${mmss(n.t)}"></button>`).join(''); document.querySelectorAll('[data-pin]').forEach(p => p.onclick = e => { e.stopPropagation(); const n = notes().find(x => x.id === p.dataset.pin); seek(n.t); setActive(n.id, true); }); };

  const seek = t => { a.currentTime = Math.max(0, Math.min(dur(), t)); tick(); };

  const tick = () => {
    const t = RV.scrubT ?? (a.currentTime || 0), p = Math.min(100, t / dur() * 100);
    document.getElementById('rvfill').style.width = p + '%'; document.getElementById('rvhead').style.left = p + '%';
    document.getElementById('rvtime').textContent = `${mmss(t)} / ${mmss(dur())}`;
    const stp = document.getElementById('rvnt'), tx = document.getElementById('rvtxt'); if (stp && document.activeElement !== tx) stp.textContent = stampText(t);

    if (id !== RV.active && !a.paused) { RV.active = id; paintNotes(); paintPins(); }
  };
  function paintNotes() {
    const own = role.mode === 'direcao' ? role.name : null, son = role.mode === 'sonoplastia';

    document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === RV.filter));
    document.getElementById('rvnotes').innerHTML = list.length ? list.map(n => `<div class="rv-note ${n.status === 'feita' ? 'feita' : ''} ${RV.active === n.id ? 'on' : ''}" data-n="${n.id}">
      <button class="rv-t" data-seek="${n.t}" title="Ir para este momento">${mmss(n.t)}</button>
      <div><div><span class="rv-au">${dchip(n.author)}</span>${sceneTag(ver, n.t)}${own && n.author === own ? '<span class="rv-mine">tu</span>' : ''} ${n.status === 'feita' ? `<span class="pill ok">Feita${n.done_by ? ' por ' + esc(n.done_by) : ''}</span>` : ''}</div>
        ${RV.editing === n.id ? `<textarea class="rv-edit" data-edit="${n.id}" style="width:100%;margin-top:6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font:inherit;color:var(--text)" rows="2">${esc(n.text)}</textarea>
          <div style="display:flex;gap:8px;margin-top:6px"><button class="btn blue" data-save="${n.id}">Guardar</button><button class="btn" data-cancel>Cancelar</button></div>` : `<div class="rv-text">${esc(n.text)}</div>`}
        ${(n.agree || []).length || (own && n.author !== own) ? `<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">${own && n.author !== own ? `<button class="rv-agree ${(n.agree || []).includes(own) ? 'on' : ''}" data-agree="${n.id}">Também reparei${(n.agree || []).length ? ' · ' + n.agree.length : ''}</button>` : `<span class="note">${n.agree.length} também reparou(aram)</span>`}${(n.agree || []).length && own && n.author !== own ? `<span class="note">${n.agree.map(esc).join(', ')}</span>` : ''}</div>` : ''}
        ${n.reply ? `<div class="rv-reply">${dchip(n.reply_by || 'Sonoplastia')} ${esc(n.reply)}</div>` : ''}
        ${RV.replying === n.id ? `<textarea class="rv-edit" data-reply="${n.id}" style="width:100%;margin-top:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:8px 10px;font:inherit;color:var(--text)" rows="2" placeholder="Resposta para a Direção">${esc(n.reply || '')}</textarea>
          <div style="display:flex;gap:8px;margin-top:6px"><button class="btn blue" data-savereply="${n.id}">Enviar resposta</button><button class="btn" data-cancel>Cancelar</button></div>` : ''}</div>
      <div class="rv-act">${son ? `<button data-done="${n.id}">${n.status === 'feita' ? 'Reabrir' : 'Marcar como feita'}</button><button data-rep="${n.id}">Responder</button>` : ''}
        ${(son || own === n.author) ? `<button data-edit-btn="${n.id}">Editar</button><button data-del="${n.id}">Apagar</button>` : ''}</div></div>`).join('')
      : `<p class="note" style="padding:18px 16px;margin:0">${RV.filter === 'abertas' ? 'Não há notas abertas.' : 'Ainda não há notas nesta versão.'}</p>`;
    document.querySelectorAll('[data-seek]').forEach(b => b.onclick = () => { seek(+b.dataset.seek); a.play().catch(() => {}); });
    const upd = async (id, body) => { try { const n = await api(`/api/episodes/${RV.id}/review/notes/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); Object.assign(RV.data.review.notes.find(x => x.id === id), n); } catch (e) { showErr(e); } RV.editing = RV.replying = null; paintNotes(); paintPins(); };
    document.querySelectorAll('[data-agree]').forEach(b => b.onclick = () => { const n = RV.data.review.notes.find(x => x.id === b.dataset.agree); upd(n.id, { agree: { name: own, on: !(n.agree || []).includes(own) } }); });
    document.querySelectorAll('[data-done]').forEach(b => b.onclick = () => { const n = RV.data.review.notes.find(x => x.id === b.dataset.done); upd(n.id, { status: n.status === 'feita' ? 'aberta' : 'feita', by: 'Sonoplastia' }); });
    document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => { RV.replying = b.dataset.rep; paintNotes(); document.querySelector('[data-reply]')?.focus(); });
    document.querySelectorAll('[data-savereply]').forEach(b => b.onclick = () => upd(b.dataset.savereply, { reply: document.querySelector(`[data-reply="${b.dataset.savereply}"]`).value, by: 'Sonoplastia' }));
    document.querySelectorAll('[data-edit-btn]').forEach(b => b.onclick = () => { RV.editing = b.dataset.editBtn; paintNotes(); document.querySelector('[data-edit]')?.focus(); });
    document.querySelectorAll('[data-save]').forEach(b => b.onclick = () => upd(b.dataset.save, { text: document.querySelector(`[data-edit="${b.dataset.save}"]`).value }));
    document.querySelectorAll('[data-cancel]').forEach(b => b.onclick = () => { RV.editing = RV.replying = null; paintNotes(); });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
      if (!confirm('Apagar esta nota?')) return;
      await api(`/api/episodes/${RV.id}/review/notes/${b.dataset.del}`, { method: 'DELETE' }).catch(showErr);
      RV.data.review.notes = RV.data.review.notes.filter(x => x.id !== b.dataset.del); paintNotes(); paintPins();
    });
  }
  RV.repaint = () => { paintNotes(); paintPins(); RV.tapeDraw && RV.tapeDraw(); tick(); };
  RV.tick = tick; a.ontimeupdate = tick; a.onloadedmetadata = () => { tick(); paintPins(); };
  a.onplay = a.onpause = () => { document.getElementById('rvplay').innerHTML = a.paused ? I.play : I.stop; };
  document.getElementById('rvplay').onclick = () => a.paused ? a.play().catch(() => {}) : a.pause();
  document.getElementById('rvb10').onclick = () => seek(a.currentTime - 10);
  document.getElementById('rvf10').onclick = () => seek(a.currentTime + 10);
  document.getElementById('rvspd').onchange = e => { a.playbackRate = +e.target.value; };
  document.getElementById('rvver').onchange = e => { RV.v = e.target.value; RV.active = null; location.hash = `#/revisao/${RV.id}/${RV.v}`; };
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { RV.filter = b.dataset.f; paintNotes(); });
  bar.onclick = e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * dur()); };
  if (role.mode === 'direcao') {
    const txt = document.getElementById('rvtxt'), nt = document.getElementById('rvnt'), bar2 = document.getElementById('rvsheet');
    const paintNear = () => {
      const near = notes().filter(n => Math.abs(n.t - RV.noteT) <= 20), box = document.getElementById('rvnear');
      box.innerHTML = near.length ? near.map(n => `<div class="it"><span>${dchip(n.author)} ${sceneTag(ver, n.t)} <b>${mmss(n.t)}</b> ${esc(n.text)}</span>${n.author !== role.name ? `<button class="rv-agree ${(n.agree || []).includes(role.name) ? 'on' : ''}" data-near="${n.id}">Também reparei${(n.agree || []).length ? ' · ' + n.agree.length : ''}</button>` : ''}</div>`).join('') : '';
      box.querySelectorAll('[data-near]').forEach(b => b.onclick = async () => { const n = RV.data.review.notes.find(x => x.id === b.dataset.near); try { Object.assign(n, await api(`/api/episodes/${RV.id}/review/notes/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ agree: { name: role.name, on: !(n.agree || []).includes(role.name) } }) })); } catch (e) { showErr(e); } paintNear(); paintNotes(); });
    };
    const stamp = () => { RV.noteT = a.currentTime || 0; nt.textContent = stampText(RV.noteT); paintNear(); };
    txt.onfocus = () => { stamp(); if (!a.paused) { a.pause(); RV.pausedByUs = true; } };
    txt.onblur = () => setTimeout(() => { if (document.activeElement !== txt && !txt.value.trim() && RV.pausedByUs) { RV.pausedByUs = false; a.play().catch(() => {}); } }, 200);
    bar2.addEventListener('mousedown', e => { if (e.target.closest('button')) e.preventDefault(); });
    let sending = false;
    const add = async () => {
      const text = txt.value.trim(); if (!text || sending) return;
      sending = true; txt.value = '';       // esvazia já: o mesmo toque não pode enviar duas vezes
      try {
        const n = await api(`/api/episodes/${RV.id}/review/notes`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ version: ver.id, t: RV.noteT, text, author: role.name }) });
        RV.data.review.notes.push(n); txt.blur(); RV.active = n.id; paintNotes(); paintPins();
        if (RV.pausedByUs) { RV.pausedByUs = false; a.play().catch(() => {}); }
      } catch (e) { txt.value = text; alert(e.message); }
      sending = false;
    };
    document.getElementById('rvform').onsubmit = e => { e.preventDefault(); add(); };
    document.getElementById('rvadd').addEventListener('pointerdown', e => { e.preventDefault(); add(); });   // um toque só: envia sem fechar o teclado primeiro
    txt.onkeydown = e => { if (e.key === 'Escape') txt.blur(); };
  }
  paintNotes(); paintPins(); tick();
}

document.addEventListener('keydown', e => {
  const a = document.getElementById('rvaudio');
  if (!a || location.hash.indexOf('#/revisao') !== 0 || (e.target.closest && e.target.closest('input,textarea,select,[contenteditable]')) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); a.paused ? a.play().catch(() => {}) : a.pause(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); a.currentTime = Math.max(0, a.currentTime - 5); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); a.currentTime = Math.min(a.duration || 1e9, a.currentTime + 5); }
  else if ((e.key === 'n' || e.key === 'N') && document.getElementById('rvsheet')) { e.preventDefault(); document.getElementById('rvnoteknob').click(); }
});

/* ---------- Maestro: músicas e stems por cena ---------- */
const MA = { id: null, data: null, poll: null, scene: null, wasRunning: false };
const maBusy = m => m.status === 'a planear' || m.status === 'a gerar';
const ROLE_PT = { bed: 'CAMA', stem: 'STEM', stinger: 'STINGER', transition: 'TRANSIÇÃO' };

async function maestroPage(wanted, scene) {
  try { S.list = await api('/api/episodes'); } catch { S.list = []; }
  if (!S.list.length) {
    $app.innerHTML = shell('maestro', `<div class="wrap"><h1 class="page-t">Maestro</h1><p class="page-s" style="margin-bottom:32px">Músicas e stems para cada cena.</p>
      <div class="card empty">Ainda não há episódios. Carrega a gravação e o guião no <a href="#/autotake">AutoTake</a> primeiro.</div></div>`);
    return;
  }
  const pick = S.list.find(e => e.id === wanted) || S.list.find(e => e.id === MA.id) || S.list.find(e => e.state?.status === 'pronto') || S.list[0];
  MA.id = pick.id; MA.scene = scene || null;
  await loadMaestro();
}

async function loadMaestro() {
  clearTimeout(MA.poll);
  try { MA.data = await api(`/api/episodes/${MA.id}/maestro`); }
  catch (e) { $app.innerHTML = shell('maestro', `<div class="wrap"><div class="errbox">${esc(e.message)}</div></div>`); return; }
  const running = maBusy(MA.data.maestro), a = document.activeElement;
  const typing = a && a.matches && a.matches('textarea, input[type=number], input[type=text]');
  if (!typing || (MA.wasRunning && !running)) renderMaestro();
  MA.wasRunning = running;
  if (running) MA.poll = setTimeout(loadMaestro, 3000);
}

function renderMaestro() {
  const d = MA.data, mo = d.maestro, an = d.analysis, scenes = an.scenes || [], busy = maBusy(mo);
  const sc = MA.scene ? scenes.find(x => x.n === MA.scene) : null;
  const piecesOf = n => (mo.scenes[String(n)] || {}).pieces || [];
  const epOpts = S.list.map(e => `<option value="${e.id}" ${e.id === MA.id ? 'selected' : ''}>${esc(e.title)}</option>`).join('');
  const status = !d.claude ? 'Falta a chave da Anthropic no servidor: o Claude não pode planear as músicas.'
    : !d.eleven ? 'Falta a chave da ElevenLabs no servidor: não é possível gerar as músicas.'
    : mo.status === 'a planear' ? `O Claude está a planear as músicas, ${mo.done} de ${mo.total} cenas…`
    : mo.status === 'a gerar' ? `A gerar músicas na ElevenLabs, ${mo.done} de ${mo.total}… cada uma pode demorar um minuto.` : '';
  const errs = Object.entries(mo.errors || {}).map(([n, m]) => `<div class="errbox" style="margin:0 0 12px">Cena ${n}: ${esc(m)}</div>`).join('');
  const post = (path, body) => api(`/api/episodes/${MA.id}/maestro/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const head = `<div class="ep-head"><div><h1 class="page-t">Maestro</h1>
      <p class="page-s">${sc ? `Cena ${sc.n}: ${esc(sc.title)}` : 'O Claude lê cada cena e decide as músicas e os stems (3 a 5 por cena), todos diferentes. A ElevenLabs gera-os e eles entram sozinhos na timeline da Estrutura Plus.'}</p></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><select class="epsel" id="maep" aria-label="Episódio">${epOpts}</select>
        ${sc ? '' : `<button class="btn blue" id="maplanall" ${S.demo || busy || !d.claude ? 'disabled' : ''}>${I.spark}${busy ? 'A trabalhar…' : 'Planear as cenas'}</button>
        <button class="btn" id="magenall" ${S.demo || busy || !d.eleven ? 'disabled' : ''}>${I.music}Gerar todas as músicas</button>
        <button class="btn" id="mamontall" ${S.demo || busy || !scenes.some(s => piecesOf(s.n).some(p => p.state === 'gerado')) ? 'disabled' : ''} title="Põe todas as músicas geradas na timeline da Estrutura Plus">${I.layers}Montar tudo no Plus</button>`}</div></div>
      ${status ? `<p class="st-note" style="margin:0 0 16px">${esc(status)}</p>` : ''}${errs}
      ${mo.status === 'erro' ? `<div class="errbox" style="margin:0 0 16px">${esc(mo.message)}</div>` : ''}`;

  if (!sc) {
    $app.innerHTML = shell('maestro', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios.</div>' : ''}<div class="wrap">${head}
      <div class="projs" style="margin-top:0">${scenes.map(s => { const ps = piecesOf(s.n), g = ps.filter(p => p.state === 'gerado').length; return `
        <a class="card fcard" href="#/maestro/${MA.id}/${s.n}"><b style="font-size:13px;color:var(--muted);letter-spacing:.04em">CENA ${s.n}</b>
          <b style="font-size:17px;line-height:1.3">${esc(s.title)}</b>
          <span>${ps.length ? `<b style="color:var(--accent)">${ps.length} peças</b> · ${g} geradas` : 'sem músicas planeadas'}</span></a>`; }).join('')}</div></div>`);
    document.getElementById('maplanall').onclick = async () => {
      const replace = scenes.every(s => piecesOf(s.n).length);
      if (replace && !confirm('Todas as cenas já têm músicas planeadas. Voltar a planear substitui-as, incluindo as geradas. Continuar?')) return;
      try { await post('plan', { scene: 'all', replace }); } catch (e) { alert(e.message); return; }
      loadMaestro();
    };
    document.getElementById('mamontall').onclick = async () => {
      let r; try { r = await post('send', { scene: 'all' }); } catch (e) { alert(e.message); return; }
      const sk = Object.entries(r.skipped || {});
      if (sk.length) alert(`${r.sent} músicas montadas em ${r.scenes} cenas.\n\nNão entraram:\n` + sk.map(([n, m]) => `Cena ${n}: ${m}`).join('\n'));
      location.hash = `#/estrutura/${MA.id}/0`;
    };
    document.getElementById('magenall').onclick = async () => {
      const n = scenes.reduce((a, s) => a + piecesOf(s.n).filter(p => p.state === 'novo' || p.state === 'erro').length, 0);
      if (!n) { alert('Não há músicas por gerar. Planeia primeiro as cenas.'); return; }
      if (!confirm(`Gerar ${n} músicas na ElevenLabs? Gasta créditos e pode demorar alguns minutos.`)) return;
      try { await post('generate', { scene: 'all' }); } catch (e) { alert(e.message); return; }
      loadMaestro();
    };
  } else {
    const ps = piecesOf(sc.n), info = mo.scenes[String(sc.n)] || {}, items = (an.items || []).filter(it => it.id >= sc.from && it.id <= sc.to && (it.type === 'narracao' || it.type === 'entrevista'));
    const byId = Object.fromEntries((an.items || []).map(it => [it.id, it]));
    const card = p => `<div class="card mp" data-p="${p.id}">
      <div class="hd"><span class="rchip ${p.role}">${ROLE_PT[p.role] || p.role}</span><div style="flex:1;min-width:200px"><b style="font-size:16px">${esc(p.label)}</b>
        ${p.description ? `<div class="note" style="margin-top:2px">${esc(p.description)}</div>` : ''}</div>
        <button class="del" data-del="${p.id}" aria-label="Remover ${esc(p.label)}" ${S.demo ? 'disabled' : ''} style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--faint)">${I.trash}</button></div>
      <textarea data-prompt="${p.id}" rows="3" aria-label="Prompt para a ElevenLabs" ${S.demo ? 'disabled' : ''}>${esc(p.prompt)}</textarea>
      <div class="row2"><span>Duração <input type="number" data-dur="${p.id}" min="3" max="120" value="${p.duration}" ${S.demo ? 'disabled' : ''}> s</span>
        ${p.item && byId[p.item] ? `<span>Entra em: “${esc(byId[p.item].text.slice(0, 48))}…”</span>` : ''}</div>
      <div class="row2" style="gap:10px">
        ${p.state === 'gerado' ? `<audio controls preload="none" src="/api/episodes/${MA.id}/maestro/pieces/${p.id}/audio?v=${p.length || ''}"></audio>` : ''}
        ${p.state === 'a gerar' ? '<span>A gerar na ElevenLabs…</span>' : p.state === 'erro' ? `<span style="color:var(--warn)">${esc(p.message)}</span>` : p.state === 'novo' ? '<span>Por gerar</span>' : ''}
        <button class="btn blue" data-gen="${p.id}" ${S.demo || busy || !d.eleven || p.state === 'a gerar' ? 'disabled' : ''}>${I.spark}${p.state === 'gerado' ? 'Regenerar' : 'Gerar'}</button>
        ${p.state === 'gerado' ? `<a class="btn" href="/api/episodes/${MA.id}/maestro/pieces/${p.id}/audio" download>${I.dl}Descarregar</a>
          <button class="btn" data-stems="${p.id}" ${S.demo || busy ? 'disabled' : ''} title="Separa a música em stems (bateria, baixo, outros…) na ElevenLabs">Separar stems</button>
          ${p.stems ? `<a class="btn" href="/api/episodes/${MA.id}/maestro/pieces/${p.id}/stems.zip">${I.dl}Stems (zip)</a>` : ''}` : ''}</div></div>`;
    $app.innerHTML = shell('maestro', `${S.demo ? '<div class="banner">Demonstração: os dados são fictícios.</div>' : ''}<div class="wrap">
      <p style="margin:0 0 12px"><a class="back" href="#/maestro/${MA.id}">${I.chevL}Todas as cenas</a></p>${head}
      <div class="card an-sc">
        <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-end">
          <label class="field" style="flex:1 1 320px;margin:0">Notas para o Claude sobre as músicas desta cena (opcional)
            <input type="text" id="manote" maxlength="2000" placeholder="Ex.: mais piano e menos sintetizadores; tensão a crescer até ao fim" ${S.demo ? 'disabled' : ''}></label>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="maplan" ${S.demo || busy || !d.claude ? 'disabled' : ''}>${I.spark}${ps.length ? 'Planear de novo' : 'Planear com o Claude'}</button>
            <button class="btn" id="magen" ${S.demo || busy || !d.eleven || !ps.some(p => p.state === 'novo' || p.state === 'erro') ? 'disabled' : ''}>${I.music}Gerar tudo</button>
            <button class="btn blue" id="masend" ${S.demo || busy || !ps.some(p => p.state === 'gerado') ? 'disabled' : ''} title="Põe as músicas geradas desta cena na timeline da Estrutura Plus">${I.layers}Montar no Plus</button></div></div>
        ${info.direction ? `<p style="margin:14px 0 0"><b style="font-size:12px;color:var(--muted);letter-spacing:.04em">ARCO MUSICAL</b><br>${esc(info.direction)}</p>` : ''}
        <p class="note" style="margin:10px 0 0">Depois de gerar, as músicas entram sozinhas na timeline da Estrutura Plus. Para músicas que já tinhas geradas, usa <b>Montar no Plus</b>: as camas vão para a faixa <b>Música</b> e os stems, stingers e transições para a <b>Música 2</b>, no parágrafo escolhido.</p>
      </div>
      ${ps.length ? ps.map(card).join('') : `<div class="card empty" style="margin-top:14px">Esta cena ainda não tem músicas. Carrega em <b>Planear com o Claude</b>, ou acrescenta uma à mão abaixo.</div>`}
      <div class="card mp"><b>Acrescentar uma música</b>
        <textarea id="mnew" rows="2" placeholder="Descreve a música ou o stem (português ou inglês). Ex.: percussão suave de tique-taque, misteriosa, só esse elemento" ${S.demo ? 'disabled' : ''}></textarea>
        <div class="row2"><select class="epsel" id="mnrole"><option value="bed">Cama</option><option value="stem">Stem</option><option value="stinger">Stinger</option><option value="transition">Transição</option></select>
          <span>Duração <input type="number" id="mndur" min="3" max="120" value="40"> s</span><button class="btn blue" id="mnadd" ${S.demo ? 'disabled' : ''}>Adicionar</button></div></div>
      <details style="margin-top:14px"><summary style="cursor:pointer;font-weight:600;font-size:14px">Texto da cena (${items.length} parágrafos)</summary>
        ${items.map(it => `<div style="display:flex;gap:10px;margin-top:8px;align-items:flex-start"><span class="itag ${it.type}">${it.type === 'narracao' ? 'NARRAÇÃO' : 'ENTREVISTA'}</span><span style="font-size:14px">${esc(it.text.length > 400 ? it.text.slice(0, 400) + '…' : it.text)}</span></div>`).join('')}</details></div>`);

    document.getElementById('maplan').onclick = async () => {
      if (ps.length && !confirm('Isto substitui as músicas desta cena, incluindo as já geradas. Continuar?')) return;
